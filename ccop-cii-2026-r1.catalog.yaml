        parts:
        - id: ccop-1.1.1_smt
          name: statement
          prose: This Code is the Cybersecurity Code of Practice for Critical Information
            Infrastructure (2026) and shall take effect from 29 July 2026, superseding
            previous versions of the Code.
    - id: ccop-g-1.2
      class: ccop-subsection
      title: Glossary and Interpretation
      props:
      - name: label
        value: '1.2'
      controls:
      - id: ccop-1.2.1
        class: ccop-provision
        title: CCoP 1.2.1
        props:
        - name: label
          value: 1.2.1
        - name: source-page
          value: '7'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.2.1_smt
          name: statement
          prose: 'In this Code, unless the context otherwise requires, the following
            terms shall have the corresponding meaning – “Act” The Cybersecurity Act
            2018 “Board of Directors” A body of elected or appointed members who are
            primarily responsible for the governance of an organisation, including
            overseeing its strategic, operational, financial, risk management, and
            cybersecurity activities such as the management of cyber risks and the
            resilience of key organisational critical systems to ensure its long-term
            success. It can also refer to an equivalent governing body and/or risk
            committee. Adapted from Singapore Institute of Director’s Board Guide
            and Corporate Governance Guide. “break-glass” A procedure used in critical
            emergencies when a user with insufficient access is granted elevated privileges
            to bypass standard authentication mechanisms. “business continuity plan”
            Documented procedures that guide organisations to respond, (“BCP”) recover,
            resume and restore businesses to a pre-defined level of operation following
            disruption and cover the resources, services and activities required to
            ensure the continuity of essential services. “Commissioner” The Commissioner
            of Cybersecurity appointed under section 4(1)(a) of the Act, and includes
            the Deputy Commissioner and Assistant Commissioners of Cybersecurity appointed
            under section 4(1)(b) of the Act. “critical information As defined in
            section 2 of the Act. infrastructure” (“CII”) “CII asset” The components
            of an information technology (IT) or operational technology (OT) system
            and/or network infrastructure of a CII and includes physical devices and
            systems, software platforms and applications of the CII. “CII Designation
            Date” Refers to the date on which a computer or computer system was designated
            as a CII under section 7(1) or 1(A) of the Act. “CIIO” Refers to the CII
            Owner, who is the designated entity of a CII as defined in section 2 of
            the Act. “Code” This Cybersecurity Code of Practice for Critical Information
            Infrastructure. “Compliance Date” Means: (a) In respect of an Existing
            CII, the Compliance Date as stipulated in the Compliance Overview; and
            (b) In respect of a CII designated on or after the Effective Date, an
            appropriate grace period to be determined by Commissioner will be provided
            to meet the compliance timeline “cyber operating The operating environment
            that includes systems, environment” applications, networks, physical sites,
            external interfaces and access activities. “cybersecurity” As defined
            in section 2 of the Act. “cybersecurity event” An observable occurrence
            of an activity in or through a computer or computer system that may affect
            the cybersecurity of that or another computer or computer system and includes
            a cybersecurity incident. “cybersecurity incident” As defined in section
            2 of the Act. “cybersecurity risk As defined in regulation 6 of the Cybersecurity
            (Critical assessment” Information Infrastructure) Regulations 2018. “cybersecurity
            risk profile” A profile that outlines a CII’s known cybersecurity risks,
            policy constraints and regulatory obligations for the determination of
            level risk mitigating controls required. “cybersecurity threat” As defined
            in section 2 of the Act. “disaster recovery plan” A documented procedure
            which guides organisations on the (“DRP”) steps to recover IT and/or OT
            capability when a disruption occurs. “Effective Date” Refers to the date
            on which this version of the Code takes effect. “enterprise system” Refers
            to the components of an IT or OT system, and/or network infrastructure
            owned and controlled by the CIIO that supports the CIIO’s business, operational,
            or administrative functions and services. “essential service” As defined
            in section 2 of the Act. “Existing CII” Refers to a computer or computer
            system that is designated as a CII under section 7(1) or 1(A) of the Act
            as at the Effective Date and includes such a computer or computer system
            that becomes a Redesignated CII within 12 months from the Effective Date.
            Illustration A computer or computer system was designated as a CII on
            1 November 2021 and remains designated as such at the Effective Date.
            This is an Existing CII. The designation of the same computer or computer
            system is withdrawn on 1 November 2022, and a new designation takes effect
            from the same day. This computer or computer system is also an Existing
            CII. “external party” Refers to any third-party, vendor, contractor, consultant,
            service provider, or other external entity that has access to, connectivity
            with, or provides services supporting the CIIO’s systems or operations.
            “indicators of compromise” Traces of security breach which can include
            IP addresses, (“IOC”) Uniform Resource Locator (URL), domain, hashes,
            registry, filename, etc. “information technology” An arrangement of interconnected
            computers that is used in (“IT”) the storing, accessing, processing, analysing
            and sending of information, for example: computing and telecommunications
            equipment. “interconnected systems” The components of an IT or OT system
            and/or network infrastructure that communicates with or connects to the
            CII. “Kerberos Ticket Granting The account is a special hidden account
            that encrypts all other Ticket account” authentication tokens in the Kerberos
            authentication protocol. An attacker who has compromised the account can
            forge a ticket to gain complete access to the entire domain. “malware”
            Malicious software or firmware intended to perform unauthorised processes
            that will have adverse impact on the confidentiality, integrity, or availability
            of a computer system, for example: virus, worm, Trojan horse, spyware
            and some forms of adware or other code-based entity that infects a host.
            “material” Any change that affects or may affect the cybersecurity of
            the CII or the ability of the CIIO to respond to a cybersecurity threat
            or incident affecting the CII. “mechanism” An automated process that performs
            a series of activities. “operational technology” An arrangement of interconnected
            computers that is used in (“OT”) the monitoring and/or control of physical
            processes, that includes: (a) Supervisory control and data acquisition
            systems, distributed control systems, and other control system configuration
            such as programmable logic controllers; (b) A combination of control components,
            for example electrical, mechanical, hydraulic, pneumatic, that act together
            to achieve an industrial objective, for example manufacturing, transportation
            of matter or energy. “organisational structure” The hierarchical arrangement
            of roles, lines of authority, and communications of an organisation. “patch”
            A set of changes to a software or firmware that addresses its cybersecurity
            vulnerabilities, or other updates to its functionality, usability or performance.
            “patch management” The process involving one or more of the following
            actions of acquiring, testing and installing patches or updates on existing
            software or firmware, enabling systems to stay updated, addressing vulnerabilities
            and includes patching applications, anti-malware, and firmware. “penetration
            testing” An authorised process of evaluating the security of a computer
            system, network or application by finding vulnerabilities attackers could
            exploit and includes the process of: (a) gathering information about the
            target; (b) identifying possible entry points; (c) attempting to break
            in (either virtually or for real); and (d) reporting the findings. “periodic”
            To perform an activity at a predefined interval. “physical sites” Primary
            and secondary locations hosting the CII. “purple teaming” In the context
            of an attack simulation means an exercise where the attack activity is
            revealed and explained to the blue team, and the red and blue teams work
            together and openly in real time to discuss each attack technique and
            the corresponding defensive measures, to improve people, process and technologies.
            “Previous Version” Refers to the version of the Cybersecurity Code of
            Practice for Critical Information Infrastructure issued by the Commissioner
            on 1 September 2018, amended on 20 December 2019, and reissued on 4 July
            2022 and 12 December 2022. “privilege” The rights assigned to any account
            including any user, application, service or system account. “privileged
            account” Any account including any user, application, service or system
            account, that has administrative access privileges. “recovery point objective”
            The amount of data that can be lost within a period most relevant to a
            business, before significant harm occurs, from the point of a critical
            event to the most preceding backup. “recovery time objective” The quantity
            of time that an application, system and/or process, can be down for without
            causing significant damage to the business as well as the time spent restoring
            the application and its data. “regular basis” A recurring frequency for
            conducting an activity determined by the organisation based on its risk
            appetite, the criticality of the systems or processes involved, and the
            evolving cyber threat landscape “remote access” Access to a CII by a user,
            or a process acting on behalf of a user, communicating through an external
            network. “remote facilities” Computer or computer system that has remote
            access capability. “residual risk” The risk exposure after risk mitigating
            controls is considered or applied. “risk appetite” The amount of risk,
            on a broad level, that CIIO is willing to accept in pursuit of its strategic
            objectives. “scenario-based An activity to assess and validate an organisation’s
            plans and cybersecurity exercise” capabilities relating to the handling
            of simulated cybersecurity incidents (the ‘scenario’) affecting the organisation.
            The exercise scenario should be based on relevant threats. Depending on
            the nature of the threats, CIIO may include social engineering and cyber
            range components in these scenarios. “sector lead” A government agency
            overseeing and/or regulating/licensing a particular sector. “security
            architecture” A set of physical and logical cybersecurity representations
            that addresses potential cybersecurity risks and gaps in the environment.
            “secured intermediary A security hardened agent or device that is used
            to access and mechanism” manage a system that resides in a different security
            zone. Examples include a jump server and bastion host. “senior management”
            Executive leadership team comprising C-Suite personnel such as CEO, CIO,
            CISO or other suitably qualified personnel responsible for the strategic
            direction and overall management of the organisation. Adapted from ISO/IEC
            27000:2018 “sensitive data” Sensitive data include production data and
            system configuration information. “shall” In this Code, means that the
            statement mentioned is a mandatory requirement for compliance. “shared
            user account” Accounts that are shared by one or more users and includes
            shared administrative user accounts. “should” In this Code, means that
            the statement mentioned is a recommended requirement. “stakeholder” Refers
            to any individual, group, or organisation that has an interest in or is
            affected by the decisions, activities, or outcomes of a project, organisation,
            or policy. “strong encryption” Industry-accepted standard algorithms to
            scramble data and encrypts/decrypts with key to achieve data confidentiality.
            “system development The process of planning, analysis, design, development,
            lifecycle” testing, implementation, maintenance and retirement of a computer
            system. “threat hunting” The proactive effort to search for signs of malicious
            activity that has evaded security defences within the CII. It can be triggered
            by threat intelligence report, security monitoring, incident response,
            crown jewel analysis, domain expertise and analysis against MITRE ATT&CK,
            a globally accessible knowledge base of adversary tactics and techniques
            based on real-world observations. “test environment” A setup of computer
            or computer systems to support test use cases. “timely manner” To perform
            an activity as soon as possible. “vulnerability assessment” The process
            of identifying, assessing and ranking security vulnerabilities in a computer
            system. all other words and phrases shall have the same meaning as defined
            in the Act.'
      - id: ccop-1.2.2
        class: ccop-provision
        title: CCoP 1.2.2
        props:
        - name: label
          value: 1.2.2
        - name: source-page
          value: '13'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.2.2_smt
          name: statement
          prose: A reference in this Code to a “clause” shall, unless otherwise stated,
            be construed as a reference to the corresponding clause in this Code and
            shall include all sub-clauses within that clause.
      - id: ccop-1.2.3
        class: ccop-provision
        title: CCoP 1.2.3
        props:
        - name: label
          value: 1.2.3
        - name: source-page
          value: '13'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.2.3_smt
          name: statement
          prose: A reference in this Code to “including” shall not be construed restrictively
            but shall mean “including without prejudice to the generality of the foregoing”
            and “including but without limitation”.
      - id: ccop-1.2.4
        class: ccop-provision
        title: CCoP 1.2.4
        props:
        - name: label
          value: 1.2.4
        - name: source-page
          value: '13'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.2.4_smt
          name: statement
          prose: Use of the singular is deemed to include the plural (and vice versa).
      - id: ccop-1.2.5
        class: ccop-provision
        title: CCoP 1.2.5
        props:
        - name: label
          value: 1.2.5
        - name: source-page
          value: '13'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.2.5_smt
          name: statement
          prose: Unless otherwise stated, the provisions of this Code shall apply
            to the CII, and where specifically indicated to apply to systems that
            communicate with or connect to the CII that the CIIO own, operate, and/or
            control. For the avoidance of doubt, references such as “the CII” or “a
            CII” do not in any way restrict the application of this Code to other
            CII that the CIIO owns.
      - id: ccop-1.2.6
        class: ccop-provision
        title: CCoP 1.2.6
        props:
        - name: label
          value: 1.2.6
        - name: source-page
          value: '13'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.2.6_smt
          name: statement
          prose: The provisions of this Code shall also apply to CII interconnected
            systems that the CIIO own, operate, and/or control, referring to computer
            systems that connect to or communicate with the CII, as illustrated in
            the diagram below. While enterprise systems fall outside the scope of
            this Code, CIIOs are encouraged to refer to Annex A, which provides guidance
            on strengthening the cybersecurity posture of the enterprise system by
            implementing the measures set out therein.
      - id: ccop-1.2.7
        class: ccop-provision
        title: CCoP 1.2.7
        props:
        - name: label
          value: 1.2.7
        - name: source-page
          value: '14'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.2.7_smt
          name: statement
          prose: Clauses in this Code are prefaced with a preamble or include illustrations
            (presented in italicised font and without clause numbers). The preambles
            and illustrations are intended to provide additional information on the
            context, purpose, or application of the clauses they relate to. The preambles
            and illustrations do not form part of the measures that the CIIO is required
            to take under this Code and hence need not be included in the scope of
            any cybersecurity audits carried performed by the CIIO under section 15
            of the Act.
    - id: ccop-g-1.3
      class: ccop-subsection
      title: Purpose of this Code
      props:
      - name: label
        value: '1.3'
      controls:
      - id: ccop-1.3.1
        class: ccop-provision
        title: CCoP 1.3.1
        props:
        - name: label
          value: 1.3.1
        - name: source-page
          value: '14'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.3.1_smt
          name: statement
          prose: This Code is intended to specify the minimum requirements that the
            CIIO shall implement to ensure the cybersecurity of its CII and CII interconnected
            systems.
      - id: ccop-1.3.2
        class: ccop-provision
        title: CCoP 1.3.2
        props:
        - name: label
          value: 1.3.2
        - name: source-page
          value: '14'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.3.2_smt
          name: statement
          prose: The CIIO is expected to implement measures beyond those stipulated
            in this Code to further strengthen the cybersecurity of the CII, CII interconnected
            systems and the CIIO’s enterprise environment based on the cybersecurity
            risk profile of the CIIO.
    - id: ccop-g-1.4
      class: ccop-subsection
      title: Legal Effect of this Code
      props:
      - name: label
        value: '1.4'
      controls:
      - id: ccop-1.4.1
        class: ccop-provision
        title: CCoP 1.4.1
        props:
        - name: label
          value: 1.4.1
        - name: source-page
          value: '14'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.4.1_smt
          name: statement
          prose: The CIIO must comply with this Code pursuant to section 35A(6) of
            the Act.
      - id: ccop-1.4.2
        class: ccop-provision
        title: CCoP 1.4.2
        props:
        - name: label
          value: 1.4.2
        - name: source-page
          value: '14'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.4.2_smt
          name: statement
          prose: The Previous Version is superseded with effect from the Effective
            Date.
      - id: ccop-1.4.3
        class: ccop-provision
        title: CCoP 1.4.3
        props:
        - name: label
          value: 1.4.3
        - name: source-page
          value: '14'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.4.3_smt
          name: statement
          prose: As this Code may be updated periodically, the CIIO shall ensure compliance
            with each release within the compliance timeframe specified by the Commissioner
            at the time of the release’s issuance. The CIIO must ensure compliance
            with this Code by the Compliance Date as specified in the Compliance Timeline
            section.
      - id: ccop-1.4.4
        class: ccop-provision
        title: CCoP 1.4.4
        props:
        - name: label
          value: 1.4.4
        - name: source-page
          value: '14'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.4.4_smt
          name: statement
          prose: For Existing CII, during the period between the Effective Date and
            the Compliance Date (referred to below as the “transition period”), the
            CIIO minimally comply with the requirements of this Code as at the Previous
            Version.
      - id: ccop-1.4.5
        class: ccop-provision
        title: CCoP 1.4.5
        props:
        - name: label
          value: 1.4.5
        - name: source-page
          value: '14'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.4.5_smt
          name: statement
          prose: The CIIO’s obligations under this Code are in addition to its other
            obligations under the Act and other laws, and any relevant written directions
            or other codes of practice issued by the Commissioner under the Act.
      - id: ccop-1.4.6
        class: ccop-provision
        title: CCoP 1.4.6
        props:
        - name: label
          value: 1.4.6
        - name: source-page
          value: '14'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.4.6_smt
          name: statement
          prose: If any provision of this Code is held to be unlawful, all other provisions
            shall remain in full force and effect.
      - id: ccop-1.4.7
        class: ccop-provision
        title: CCoP 1.4.7
        props:
        - name: label
          value: 1.4.7
        - name: source-page
          value: '14'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.4.7_smt
          name: statement
          prose: Where the provisions specified in this Code are not met by a CIIO,
            the Commissioner may issue a direction in writing under section 12(1)
            of the Act to the CIIO for compliance with the relevant provision.
    - id: ccop-g-1.5
      class: ccop-subsection
      title: Recurring Requirements
      props:
      - name: label
        value: '1.5'
      controls:
      - id: ccop-1.5.1
        class: ccop-provision
        title: CCoP 1.5.1
        props:
        - name: label
          value: 1.5.1
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.5.1_smt
          name: statement
          prose: This Code includes clauses requiring certain acts to be performed
            on a recurring basis at fixed intervals (e.g., a requirement to perform
            an act at least once every 12 months) referred as “recurring requirements”.
            The relevant clauses prescribe the deadline for the first instance of
            the act. For subsequent instances, the deadline shall be counted from
            the date the previous instance was performed.
      - id: ccop-1.5.2
        class: ccop-provision
        title: CCoP 1.5.2
        props:
        - name: label
          value: 1.5.2
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.5.2_smt
          name: statement
          prose: 'For Existing CII, in respect of recurring requirements that already
            applied to the CII under the Previous Version, the deadline for the first
            instance after the Effective Date shall continue from the date the previous
            instance was performed. Illustrations i. For clause 1.5.1: A CIIO is to
            perform an act at least once every 12 months, with the first instance
            to be completed by 1 September 2023. If the CIIO performs the first instance
            of that act on 1 August 2023, the CIIO must perform the second instance
            of that act on or before 1 August 2024 (and not 1 September 2023). Similarly,
            if the CIIO performs the second instance of that act on 1 June 2024, the
            CIIO must perform the third instance of that act on or before 1 June 2025.
            ii. For clause 1.5.2: A CIIO was required under the Previous Version to
            perform an act at least once every 12 months, and the requirement remains
            in this Code. The CIIO last performed the act on 1 May 2022, before the
            Effective Date. The CIIO must perform the next instance of that act on
            or before 1 May 2023 (and not any other date that may be calculated based
            on the Effective Date or Compliance Date).'
    - id: ccop-g-1.6
      class: ccop-subsection
      title: Waiver
      props:
      - name: label
        value: '1.6'
      controls:
      - id: ccop-1.6.1
        class: ccop-provision
        title: CCoP 1.6.1
        props:
        - name: label
          value: 1.6.1
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.6.1_smt
          name: statement
          prose: The Commissioner may waive the application of any specific provisions
            of this Code to a CIIO under section 35A (7) of the Act.
      - id: ccop-1.6.2
        class: ccop-provision
        title: CCoP 1.6.2
        props:
        - name: label
          value: 1.6.2
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.6.2_smt
          name: statement
          prose: A CIIO can request for waiver from specific provisions of this Code
            under section 35A (7) of the Act by submitting a written request to the
            Commissioner with valid justifications and compensating controls supporting
            the request, that are in place or will be put in place to achieve the
            policy intent of the clause requirements.
      - id: ccop-1.6.3
        class: ccop-provision
        title: CCoP 1.6.3
        props:
        - name: label
          value: 1.6.3
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.6.3_smt
          name: statement
          prose: Any waiver, if granted by the Commissioner, shall be subject to such
            terms and conditions as the Commissioner may specify and may, without
            limitation, be for a fixed period or effective until the occurrence of
            a specific event.
    - id: ccop-g-1.7
      class: ccop-subsection
      title: Amendment and Revocation
      props:
      - name: label
        value: '1.7'
      controls:
      - id: ccop-1.7.1
        class: ccop-provision
        title: CCoP 1.7.1
        props:
        - name: label
          value: 1.7.1
        - name: source-page
          value: '15'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-1.7.1_smt
          name: statement
          prose: The Commissioner may, at any time, amend or revoke this Code under
            section 35(A)(b) of the Act.
  - id: ccop-g-2
    class: ccop-section
    title: AUDIT REQUIREMENTS
    props:
    - name: label
      value: '2'
    parts:
    - id: ccop-g-2_overview
      name: overview
      prose: This section sets out requirements for remediating findings from cybersecurity
        audits performed by CIIOs to ensure compliance with the Act and applicable
        codes of practice and standards of performance.
    groups:
    - id: ccop-g-2.1
      class: ccop-subsection
      title: Remediation of Audit Findings
      props:
      - name: label
        value: '2.1'
      parts:
      - id: ccop-g-2.1_overview
        name: overview
        prose: Audit findings highlight weaknesses and vulnerabilities in a computer
          or computer system that can be exploited by a cyber threat actor. Such weaknesses
          and vulnerabilities should be prioritised and remediated in a timely manner.
      controls:
      - id: ccop-2.1.1
        class: ccop-provision
        title: CCoP 2.1.1
        props:
        - name: label
          value: 2.1.1
        - name: source-page
          value: '16'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-2.1.1_smt
          name: statement
          prose: Where any audit identifies any non-compliance by a CIIO with the
            requirements specified in the Act or any codes of practice or standards
            of performance issued under the Act, the CIIO shall, unless the Commissioner
            indicates otherwise in writing, submit an audit finding remediation plan
            to the Commissioner within 30 working days from the date that the CIIO
            receives the audit report.
      - id: ccop-2.1.2
        class: ccop-provision
        title: CCoP 2.1.2
        props:
        - name: label
          value: 2.1.2
        - name: source-page
          value: '16'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-2.1.2_smt
          name: statement
          prose: 'The audit finding remediation plan shall: (a) Detail the remediation
            actions which the CIIO will take to address each area of non-compliance;
            (b) Set out the timeline(s) for implementing the actions stated in sub-clause
            (a); and (c) Identify the person(s) or department(s) responsible for the
            execution and oversight of each remediation action. (d) Specify the internal
            governance process for monitoring implementation progress, including the
            frequency of updates to the CIIO’s Board or equivalent governing body
            regarding the status of implementation of the actions stated in sub-clause
            (a).'
      - id: ccop-2.1.3
        class: ccop-provision
        title: CCoP 2.1.3
        props:
        - name: label
          value: 2.1.3
        - name: source-page
          value: '16'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-2.1.3_smt
          name: statement
          prose: The Commissioner may, after consultation with the CIIO and where
            the Commissioner considers it appropriate, require the CIIO to revise
            its audit finding remediation plan and resubmit the revised audit finding
            remediation plan to the Commissioner within such timeframe as may be prescribed
            by the Commissioner.
      - id: ccop-2.1.4
        class: ccop-provision
        title: CCoP 2.1.4
        props:
        - name: label
          value: 2.1.4
        - name: source-page
          value: '16'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-2.1.4_smt
          name: statement
          prose: The CIIO shall implement the audit finding remediation plan and complete
            all remediation actions within the timeframe(s) specified in the said
            plan, to the Commissioner’s satisfaction, and at the CIIO’s own cost.
            The CIIO shall update the Commissioner and CIIO’s Board or equivalent
            governing body when each remediation action is completed.
  - id: ccop-g-3
    class: ccop-section
    title: GOVERNANCE REQUIREMENTS
    props:
    - name: label
      value: '3'
    parts:
    - id: ccop-g-3_overview
      name: overview
      prose: Cybersecurity governance ensures that the CIIO’s strategic objectives
        are achieved by evaluating stakeholder needs and risk conditions; setting
        direction through prioritised cybersecurity frameworks; and monitoring performance
        and compliance. This structure aligns cybersecurity risk optimisation directly
        with overarching business goals.
    groups:
    - id: ccop-g-3.1
      class: ccop-subsection
      title: Board-Level Accountability
      props:
      - name: label
        value: '3.1'
      parts:
      - id: ccop-g-3.1_overview
        name: overview
        prose: The Board of Directors (or equivalent governing body and/or risk committee)
          (“the Board”) is accountable for ensuring that adequate resources and sustained
          attention are devoted to the CIIO's cybersecurity strategy. Beyond resource
          allocation, the Board sets the tone for organisational culture and risk
          appetite and is responsible for making effective and timely decisions on
          material cybersecurity matters. Strong board-level leadership is therefore
          essential, not merely in an oversight capacity, but in actively shaping
          the mindset, structure, and strategic direction that enables the organisation
          to manage cyber risk with rigour and resilience.
      controls:
      - id: ccop-3.1.1
        class: ccop-provision
        title: CCoP 3.1.1
        props:
        - name: label
          value: 3.1.1
        - name: source-page
          value: '17'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.1.1_smt
          name: statement
          prose: The CIIO shall ensure that its Board’s (or equivalent governing body
            and/or risk committee) Terms of Reference or mandate includes overseeing
            the organisation’s cybersecurity risk posture and provide strategic direction
            and guidance to Senior Management on the management of cyber risks.
      - id: ccop-3.1.2
        class: ccop-provision
        title: CCoP 3.1.2
        props:
        - name: label
          value: 3.1.2
        - name: source-page
          value: '17'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.1.2_smt
          name: statement
          prose: 'The CIIO Board’s accountability and direction shall be evidenced
            through a documented cyber resilience framework covering risk tolerance,
            risk mitigation, risk transfer and risk recovery, comprising the following
            : (a) Risk Tolerance – Issue and maintain a cyber risk appetite statement
            that defines the CIIO’s acceptable levels of cyber risk. Review the cyber
            risk appetite statement and acceptable levels of cyber risk at least once
            every 12 months, or as often as required based on the evolving cyber threat
            landscape. (b) Risk Mitigation – Be informed of the CIIO’s cybersecurity
            budget and resource allocation, and exercise oversight on whether the
            allocation is adequate to address the cyber risks at least once every
            12 months, or as often as required based on the evolving cyber threat
            landscape. (c) Risk Transfer – Be informed of the CIIO’s cyber risk transfer
            arrangements, including cyber insurance coverage and material third-party
            indemnities, and exercise oversight of the cyber risk transfer arrangements
            at least once every 12 months, or as often as required based on the evolving
            cyber threat landscape. (d) Risk Recovery – Be informed of the Business
            Continuity and Disaster Recovery strategy that defines the organisation’s
            maximum tolerable downtime following a cyber incident or a disruption
            to the provision of essential services, and exercise oversight of the
            strategy at least once every 12 months, or as often as required based
            on the evolving cyber threat landscape. The update to the Board for para
            3.1.2(a), (b), (c) and (d) shall be documented in Board minutes or equivalent
            written records;'
      - id: ccop-3.1.3
        class: ccop-provision
        title: CCoP 3.1.3
        props:
        - name: label
          value: 3.1.3
        - name: source-page
          value: '18'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.1.3_smt
          name: statement
          prose: The CIIO shall ensure that its Board (or equivalent governing body
            and/or risk committee) participates in the board cybersecurity training
            that covers, at a minimum, the strategic oversight and governance of cybersecurity
            risks, and regulatory compliance obligations under the Cybersecurity Act
            and other applicable legislation and codes of practice.
      - id: ccop-3.1.4
        class: ccop-provision
        title: CCoP 3.1.4
        props:
        - name: label
          value: 3.1.4
        - name: source-page
          value: '18'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.1.4_smt
          name: statement
          prose: The CIIO shall ensure that such cybersecurity training is contextualised
            to the CIIO's operating environment, delivered by an internal or external
            subject matter expert, and conducted at least once every 12 months, or
            as often as required based on the evolving cyber threat landscape. Newly
            appointed Board members (or equivalent governing body and/or risk committee)
            shall complete the training within 12 months of their appointment and
            shall be supported through regular cybersecurity briefings in the interim.
            The CIIO shall maintain records of attendance and curriculum for all board-level
            cybersecurity training conducted.
      - id: ccop-3.1.5
        class: ccop-provision
        title: CCoP 3.1.5
        props:
        - name: label
          value: 3.1.5
        - name: source-page
          value: '18'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.1.5_smt
          name: statement
          prose: 'The CIIO shall ensure that its Board (or equivalent governing body
            and/or risk committee) receives a cyber threat briefing at least once
            every 6 months, or as often as needed based on the evolving cybersecurity
            threat landscape, and the Board’s guidance or instructions arising from
            the cyber threat briefing shall be documented in Board minutes or equivalent
            written records. Each briefing shall cover, at a minimum: (a) Cyber threats
            relevant to the CII, the CIIO organisation and to the CIIO’s sector; (b)
            Any threats actively targeting the CII, the CIIO organisation, and/or
            the CIIO’s sector since the last briefing; and (c) Implications of those
            threats for the CIIO’s cyber risk posture, including any recommended changes
            to controls, risk appetite, cybersecurity budget or resource allocation.'
    - id: ccop-g-3.2
      class: ccop-subsection
      title: Senior Management Responsibility
      props:
      - name: label
        value: '3.2'
      parts:
      - id: ccop-g-3.2_overview
        name: overview
        prose: Senior management of the organisation (e.g. CEO, CFO, CIO, CISO, CRO,
          etc) are responsible for translating the Board's strategic direction into
          operational reality. This encompasses establishing cybersecurity policies
          and governance frameworks, identifying and managing cyber risks, allocating
          adequate resources and budget, and fostering staff awareness and a security-conscious
          culture. Senior management is further responsible for overseeing incident
          response and recovery, and for monitoring the effectiveness of cybersecurity
          controls on an ongoing basis. To close the accountability loop, senior management
          shall provide the Board with regular, substantive reporting on the organisation's
          cybersecurity posture, material risks, and significant incidents. 3.2.1.
          The CIIO shall ensure that at least one member of its senior management,
          or an individual working in or for the CIIO, possesses the knowledge and
          awareness necessary to manage cyber risks across the CII, its interconnected
          systems, and the CIIO's enterprise network, provide oversight of cybersecurity
          measures, and ensure their appropriate implementation. Where a senior management
          member or equivalent, e.g. a Chief Information Security Officer (CISO) is
          designated for this purpose, the CIIO shall ensure that the individual is
          vested with the authority and competencies required to effectively discharge
          their cybersecurity responsibilities.
      controls:
      - id: ccop-3.2.2
        class: ccop-provision
        title: CCoP 3.2.2
        props:
        - name: label
          value: 3.2.2
        - name: source-page
          value: '19'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.2.2_smt
          name: statement
          prose: 'The CIIO shall ensure that the role of the senior management or
            the assigned individual working in or for the CIIO stated in 3.2.1 are
            set out in writing, and the responsibility for each of these roles is
            assigned to a person working in or for the CIIO. This document shall:
            (a) Specify the organisational structure for persons involved in managing
            and ensuring the cybersecurity of the CIIO; (b) Specify what each of these
            roles is authorised to do and/or approve. This should include, at a minimum,
            the following areas: i. Incident reporting and escalation: the role(s)
            responsible for detecting and reporting cybersecurity incidents, the escalation
            process to senior management or the relevant authority, and the expected
            timelines for doing so. ii. Incident investigation: the role(s) responsible
            for leading and conducting investigations into cybersecurity incidents.
            iii. Cyber risk trade-off decisions: the role(s) authorised to make decisions
            to accept, mitigate, or transfer identified cyber risks, and at what threshold
            such decisions require escalation or approval from senior management or
            to the Board or equivalent governing body and/or risk committee. iv. Policy
            and resource approval: the role(s) authorised to approve cybersecurity
            policies, plans and expenditures for the effective management of cyber
            risks across the CIIO. (c) Ensure that the organisational structure prevents
            conflicts of interest from arising in relation to decisions relevant to
            the cybersecurity of the CIIO; and (d) Be formally approved by the CIIO
            personally (where the CIIO consists of one or more natural person) or
            by the relevant officers responsible for the management of the CIIO (where
            the CIIO is not a natural person).'
      - id: ccop-3.2.3
        class: ccop-provision
        title: CCoP 3.2.3
        props:
        - name: label
          value: 3.2.3
        - name: source-page
          value: '20'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.2.3_smt
          name: statement
          prose: The CIIO shall ensure that senior management provides the Board with
            a cyber threat briefing at least once every 6 months, or more frequently
            as the evolving threat landscape warrants. Each briefing shall cover,
            at a minimum, the matters set out in clauses 3.1.5(a) to (c).
      - id: ccop-3.2.4
        class: ccop-provision
        title: CCoP 3.2.4
        props:
        - name: label
          value: 3.2.4
        - name: source-page
          value: '20'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.2.4_smt
          name: statement
          prose: The CIIO shall ensure that senior management provides the Board with
            regular reports on the organisation's cybersecurity posture, risks and
            reportable incidents (in accordance with the National Cybersecurity Incident
            Reporting Framework) affecting the CII, its interconnected systems, and
            the CIIO's enterprise network. Such reports shall be provided at least
            once every 6 months, and promptly upon the occurrence of a reportable
            incidents or material changes to the CIIO's cyber risk profile. All reports
            and related deliberations shall be documented in Board’s minutes or equivalent
            written records.
      - id: ccop-3.2.5
        class: ccop-provision
        title: CCoP 3.2.5
        props:
        - name: label
          value: 3.2.5
        - name: source-page
          value: '20'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.2.5_smt
          name: statement
          prose: The CIIO shall ensure that senior management allocates adequate resources
            and budget for cybersecurity, commensurate with the cyber risks facing
            the CII, its interconnected systems, and the CIIO's enterprise network.
            The adequacy of such resources and budget shall be reviewed at least once
            every 12 months or following any material change to the CIIO's cyber risk
            profile, and the outcomes of such reviews shall be documented.
    - id: ccop-g-3.3
      class: ccop-subsection
      title: Cyber Trust Mark Certification
      props:
      - name: label
        value: '3.3'
      parts:
      - id: ccop-g-3.3_overview
        name: overview
        prose: Cyber incidents, including attacks attributed to advanced threat actors
          have demonstrated that enterprise systems beyond CII systems are increasingly
          targeted as initial entry points for compromising an organisation's critical
          operations. These incidents underscore that enterprise environments supporting
          business functions, operations, and services, while not themselves designated
          as CII, remain integral to the security and resilience of essential services.
          While CII systems are subject to the cybersecurity requirements prescribed
          under the Cybersecurity Act and the Cybersecurity Code of Practice, enterprise
          systems, including those not interconnected with the CII, may not be subjected
          to the same prescribed CII requirements. At the same time, these systems
          present an attack surface. As such, organisations should manage cybersecurity
          risks across their enterprise environment in a manner that commensurate
          with their operational context and threat profile. The Cyber Trust Mark
          provides a framework for organisations to strengthen their cyber defences
          across their enterprise environments.
      controls:
      - id: ccop-3.3.1
        class: ccop-provision
        title: CCoP 3.3.1
        props:
        - name: label
          value: 3.3.1
        - name: source-page
          value: '20'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.3.1_smt
          name: statement
          prose: The CIIO shall be certified with Cyber Trust Mark Advocate (Tier
            5) or its equivalent within 24 months of its designation as an owner of
            CII systems and ensure that its certification remain valid. For existing
            CIIO, the CIIO shall be certified with Cyber Trust Mark Advocate (Tier
            5) or its equivalent by the date stipulated by CSA.
      - id: ccop-3.3.2
        class: ccop-provision
        title: CCoP 3.3.2
        props:
        - name: label
          value: 3.3.2
        - name: source-page
          value: '21'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.3.2_smt
          name: statement
          prose: The scope of certification shall encompass the CIIO’s governance,
            risk management, and enterprise-wide management of cybersecurity capabilities,
            system operational processes, and information systems and infrastructure
            that the organisation owns, operates, and/or controls, which are used
            to deliver its products and services.
      - id: ccop-3.3.3
        class: ccop-provision
        title: CCoP 3.3.3
        props:
        - name: label
          value: 3.3.3
        - name: source-page
          value: '21'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.3.3_smt
          name: statement
          prose: The CIIO shall ensure that the audit firm it engages to perform the
            cybersecurity audit under Section 15 of the Act be certified with Cyber
            Trust Mark Advocate (Tier 5) or its equivalent.
    - id: ccop-g-3.4
      class: ccop-subsection
      title: Risk Management
      props:
      - name: label
        value: '3.4'
      parts:
      - id: ccop-g-3.4_overview
        name: overview
        prose: Cybersecurity risk management is the process of identifying, analysing,
          evaluating and addressing the organisation’s cybersecurity risks in a cost-effective
          manner. With rapid advancement in technology, acceleration in digitalisation,
          and an evolving cybersecurity threat landscape, organisations are exposed
          to greater cybersecurity risks that may adversely impact their organisation
          and business objectives. Hence it is important for CIIOs to establish and
          implement a cybersecurity risk management framework. This includes a cybersecurity
          risk assessment methodology, the organisation’s cybersecurity risk appetite
          and a risk register for each CII. In addition, CIIO shall ensure that the
          cybersecurity risks must be accepted at the appropriate level of senior
          management in a timely manner.
      controls:
      - id: ccop-3.4.1
        class: ccop-provision
        title: CCoP 3.4.1
        props:
        - name: label
          value: 3.4.1
        - name: source-page
          value: '21'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.4.1_smt
          name: statement
          prose: 'The CIIO shall establish and implement a cybersecurity risk management
            framework that provides for the following: (a) Promotion of a “risk culture”
            that enables the organisation and its personnel to have open communications
            about risk, embrace learning from positive and negative experiences, make
            informed decisions about addressing risks, and carry out risk management
            efforts commensurate with defined risk appetites; (b) The roles and responsibilities
            of various persons responsible for managing cybersecurity risks to the
            CII and their governance structure, including their reporting lines and
            accountabilities; (c) Cybersecurity risk assessment methodology; (d) Processes
            for the monitoring, communication and reporting of cybersecurity risks
            in a timely manner – the CIIO’s senior management must be given regular
            reports of cybersecurity risks to the CII so that they are kept aware
            of the risks and impact, are able to manage the risks, and can ensure
            that the necessary cybersecurity measures to address the risks are implemented;
            (e) The organisation’s cybersecurity risk appetite and thresholds or limits
            for residual risk; and (f) Process hazard analysis methodology to reduce
            or remove the impact on safety due to hazardous events (applicable for
            a CII which is an OT system).'
      - id: ccop-3.4.2
        class: ccop-provision
        title: CCoP 3.4.2
        props:
        - name: label
          value: 3.4.2
        - name: source-page
          value: '22'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.4.2_smt
          name: statement
          prose: 'The CIIO shall include the following steps in the cybersecurity
            risk assessment methodology : (a) Risk identification – identification
            of CII assets and cybersecurity threats, including threats identified
            from threat modelling , threat hunting, post-incident reviews of cybersecurity
            incidents, and the construction of risk scenarios; (b) Risk analysis –
            analysis of each risk scenario to determine the likelihood of occurrence
            and potential impact; (c) Risk evaluation – determining, documenting and
            prioritising risks; and (d) Risk response – treatment and monitoring of
            each risk to keep the risk level within the organisation’s risk tolerance
            level.'
      - id: ccop-3.4.3
        class: ccop-provision
        title: CCoP 3.4.3
        props:
        - name: label
          value: 3.4.3
        - name: source-page
          value: '22'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.4.3_smt
          name: statement
          prose: For CII which are OT systems, the CIIO shall also include non-digital
            engineering controls as mitigating controls in a cybersecurity risk assessment
            where applicable.
      - id: ccop-3.4.4
        class: ccop-provision
        title: CCoP 3.4.4
        props:
        - name: label
          value: 3.4.4
        - name: source-page
          value: '22'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.4.4_smt
          name: statement
          prose: 'The CIIO shall maintain and keep updated a risk register for each
            CII. The risk register shall record information of all cybersecurity risks
            to the CII, including risks identified through cybersecurity risk assessments.
            The risk register shall include the following: (a) Risk scenarios; (b)
            Dates when the risk scenarios are identified; (c) Existing measures in
            place to address the risk scenario; (d) Current risk ratings; (e) Risk
            treatment plan; (f) Progress status of the treatment plan; (g) Residual
            risk ratings; and (h) Risk owner.'
      - id: ccop-3.4.5
        class: ccop-provision
        title: CCoP 3.4.5
        props:
        - name: label
          value: 3.4.5
        - name: source-page
          value: '23'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.4.5_smt
          name: statement
          prose: The CIIO shall ensure that all cybersecurity risks listed in the
            risk register are reviewed and monitored regularly to ensure that the
            thresholds or limits for residual risk identified in accordance with clause
            3.4.1(e) are not breached.
    - id: ccop-g-3.5
      class: ccop-subsection
      title: Policies, Standards, Guidelines and Procedures
      props:
      - name: label
        value: '3.5'
      parts:
      - id: ccop-g-3.5_overview
        name: overview
        prose: Organisations must have governing processes in the form of policies,
          standards and guidelines in place. At the top tier of formalised governance
          are policies, which provide a generalised overview of the organisation’s
          security needs and direction. This is followed by mandatory standards for
          compliance, as well as recommended guidelines for best practice. The above
          are distilled into procedures with detailed steps and actions necessary
          to implement a specific mechanism, control or solution. Only through such
          formal documentation can organisations produce a robust and reliable security
          infrastructure by reducing uncertainty and simplifying complexity. Furthermore,
          these artefacts need to be communicated to all relevant parties to ensure
          that relevant parties have a clear understanding on the mitigating controls
          to reduce the cybersecurity risks. The artefacts need to be reviewed and
          updated periodically to ensure their relevancy to the organisation’s cybersecurity
          threat landscape.
      controls:
      - id: ccop-3.5.1
        class: ccop-provision
        title: CCoP 3.5.1
        props:
        - name: label
          value: 3.5.1
        - name: source-page
          value: '23'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.5.1_smt
          name: statement
          prose: 'The CIIO shall establish and implement policies, standards, guidelines
            and procedures for managing cybersecurity risks and protecting CII against
            cybersecurity threats. The policies, standards, guidelines and procedures
            shall be: (a) Aligned with this Code, sector regulatory cybersecurity
            requirements, and applicable sectoral or national cybersecurity policies,
            standards, directions and procedures; and (b) Published and communicated
            to all personnel and external parties who act on or have access to a CII.'
      - id: ccop-3.5.2
        class: ccop-provision
        title: CCoP 3.5.2
        props:
        - name: label
          value: 3.5.2
        - name: source-page
          value: '23'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.5.2_smt
          name: statement
          prose: The CIIO shall review the policies, standards, guidelines and procedures
            against the CII cyber operating environment and cybersecurity threat landscape
            at least once every 12 months. The first instance of this review is to
            be completed no later than 12 months from the time the policies, standards,
            guidelines and procedures were established.
      - id: ccop-3.5.3
        class: ccop-provision
        title: CCoP 3.5.3
        props:
        - name: label
          value: 3.5.3
        - name: source-page
          value: '23'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.5.3_smt
          name: statement
          prose: The CIIO shall ensure that actual practices and implementation are
            consistent with the policies, standards, guidelines and procedures. Differences,
            if any, shall be resolved in a timely manner.
    - id: ccop-g-3.6
      class: ccop-subsection
      title: Security-by-Design
      props:
      - name: label
        value: '3.6'
      parts:
      - id: ccop-g-3.6_overview
        name: overview
        prose: An effective way to protect computer systems against cybersecurity
          threats is to integrate security into every step of the System Development
          Life Cycle (SDLC), from initiation to development, deployment and eventual
          disposal of the system. This is the Security-by-Design (SBD) approach. SBD
          seeks to minimise system vulnerabilities and reduce the attack surface by
          designing and building security in every phase of the SDLC. This includes
          incorporating security specifications in the design, continuous security
          evaluation at each phase and adherence to best practices.
      controls:
      - id: ccop-3.6.1
        class: ccop-provision
        title: CCoP 3.6.1
        props:
        - name: label
          value: 3.6.1
        - name: source-page
          value: '24'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.6.1_smt
          name: statement
          prose: The CIIO shall adopt the Security-by-Design Framework established
            by CSA to the extent that it applies to the CII’s system development lifecycle.
            Where there are parts of the Framework which do not apply to the CII’s
            system development lifecycle, the CIIO shall document how and why these
            parts are not applicable.
    - id: ccop-g-3.7
      class: ccop-subsection
      title: Cybersecurity Design Principles
      props:
      - name: label
        value: '3.7'
      parts:
      - id: ccop-g-3.7_overview
        name: overview
        prose: Cybersecurity design principles underpin the security architecture
          of the system and network. Adopting these principles and taking proactive
          steps to integrate security into the design process helps to reduce the
          overall attack surface of the system and network by various means. Often,
          this can discourage a cyber-attack as it would significantly increase the
          time and effort required by a cyber threat actor to compromise the system
          and network.
      controls:
      - id: ccop-3.7.1
        class: ccop-provision
        title: CCoP 3.7.1
        props:
        - name: label
          value: 3.7.1
        - name: source-page
          value: '24'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.7.1_smt
          name: statement
          prose: 'The CIIO shall adopt the following principles in relation to its
            people, process and technologies to reduce cybersecurity risks to the
            CII: (a) The defence-in-depth principle to ensure that the security architecture
            of the CII includes multiple layers of security controls to prevent single
            point of failure; (b) The least privilege principle to ensure that accounts
            and users are granted the least extent of access necessary to perform
            their required functions; and (c) The principle of segregation of duties
            to ensure that duties and responsibilities for critical functions relating
            to the CII are divided among different persons.'
      - id: ccop-3.7.2
        class: ccop-provision
        title: CCoP 3.7.2
        props:
        - name: label
          value: 3.7.2
        - name: source-page
          value: '24'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.7.2_smt
          name: statement
          prose: 'The CIIO shall also adopt, to the extent possible, the following
            principles in relation to its people, process and technologies to reduce
            cybersecurity risks to the CII: (a) The defence-by-diversity principle
            to reduce the number of potential attack vectors by having diversity throughout
            the CII, including diversity in technology, manufacturers and suppliers
            of assets, communication pathways, etc.; and (b) The zero-trust principle
            to ensure that each request for access to the CII is authenticated, authorised
            and validated for security configuration and posture before access is
            granted.'
    - id: ccop-g-3.8
      class: ccop-subsection
      title: Change Management
      props:
      - name: label
        value: '3.8'
      parts:
      - id: ccop-g-3.8_overview
        name: overview
        prose: Change management is essential for tracking and controlling changes
          made to the system or network architecture, including to network security
          design, network connections, configuration settings, and program logic in
          both hardware and software. Good change management processes ensure that
          the current design and build state of these systems and networks are known
          and recorded to support processes such as debugging, audit, and incident
          response.
      controls:
      - id: ccop-3.8.1
        class: ccop-provision
        title: CCoP 3.8.1
        props:
        - name: label
          value: 3.8.1
        - name: source-page
          value: '25'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.8.1_smt
          name: statement
          prose: The CIIO shall establish a change management process to identify,
            authorise, implement and validate all changes made to the CII.
    - id: ccop-g-3.9
      class: ccop-subsection
      title: Use of Cloud Computing Systems and Services
      props:
      - name: label
        value: '3.9'
      parts:
      - id: ccop-g-3.9_overview
        name: overview
        prose: As technologies evolve, organisations may decide to implement parts
          or the entire computer infrastructure on cloud computing systems. It is
          important that organisations assess the risks to the CII and impact to both
          the organisation and nation from the outset when considering any such change.
          This will allow CIIOs to assess the risk trade-offs and to make an informed
          decision. The risk assessment report needs to be submitted to the Commissioner
          for review to ensure that all pertinent risks are covered.
      controls:
      - id: ccop-3.9.1
        class: ccop-provision
        title: CCoP 3.9.1
        props:
        - name: label
          value: 3.9.1
        - name: source-page
          value: '25'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.9.1_smt
          name: statement
          prose: The CIIO shall remain responsible and accountable for maintaining
            oversight of the cybersecurity of the CII and for managing cybersecurity
            risks to the CII, even when the CII is wholly or partly implemented on
            cloud computing systems.
      - id: ccop-3.9.2
        class: ccop-provision
        title: CCoP 3.9.2
        props:
        - name: label
          value: 3.9.2
        - name: source-page
          value: '25'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.9.2_smt
          name: statement
          prose: The CIIO shall inform the Commissioner of any plans to implement
            the whole or any part of the CII on cloud computing systems, regardless
            of the deployment model (e.g., public cloud, private cloud or hybrid cloud)
            or service model (e.g., software as a service, platform as a service or
            infrastructure as a service) being considered.
      - id: ccop-3.9.3
        class: ccop-provision
        title: CCoP 3.9.3
        props:
        - name: label
          value: 3.9.3
        - name: source-page
          value: '25'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.9.3_smt
          name: statement
          prose: 'The CIIO shall not implement the whole or any part of the CII on
            cloud computing systems unless: (a) It has conducted a cybersecurity risk
            assessment of the risks relating to and arising from the proposed implementation
            on cloud computing systems and ensured that the risks identified can be
            adequately addressed; (b) The completed cybersecurity risk assessment
            is formally accepted by the CIIO and submitted to the Commissioner for
            review within 30 days of its completion; and (c) Where it appears to the
            Commissioner that any part of the cybersecurity risk assessment was not
            carried out satisfactorily, the CIIO has completed rectification works
            to the Commissioner’s satisfaction at the CIIO’s own cost and within the
            timeframe(s) specified by the Commissioner.'
      - id: ccop-3.9.4
        class: ccop-provision
        title: CCoP 3.9.4
        props:
        - name: label
          value: 3.9.4
        - name: source-page
          value: '26'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.9.4_smt
          name: statement
          prose: Where the CIIO is engaging or has engaged the services of a cloud
            computing service provider to assist in implementing the whole or any
            part of the CII on cloud computing systems, the CIIO shall ensure that
            the service provider appoints a person within Singapore authorised to
            accept service of any notice or legal process relating to the provision
            of services to the CIIO on the service provider’s behalf.
    - id: ccop-g-3.10
      class: ccop-subsection
      title: Outsourcing Management
      props:
      - name: label
        value: '3.10'
      parts:
      - id: ccop-g-3.10_overview
        name: overview
        prose: A CIIO may engage external parties to perform or assist in performing
          certain functions, activities or operations in respect of the CII. Common
          examples include outsourcing certain business functions to external parties,
          or having external parties maintain certain assets and systems through contractual
          agreements. Controls must be implemented to minimise the cybersecurity risks
          and exposure that may arise from such arrangements, so as to safeguard CII
          data and operations.
      controls:
      - id: ccop-3.10.1
        class: ccop-provision
        title: CCoP 3.10.1
        props:
        - name: label
          value: 3.10.1
        - name: source-page
          value: '26'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.10.1_smt
          name: statement
          prose: The CIIO shall remain responsible and accountable for the cybersecurity
            of the CII even if it engages an external party to perform or assist in
            performing any functions, activities or operations in respect of the CII
            (referred to below as “outsourcing”).
      - id: ccop-3.10.2
        class: ccop-provision
        title: CCoP 3.10.2
        props:
        - name: label
          value: 3.10.2
        - name: source-page
          value: '26'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.10.2_smt
          name: statement
          prose: The CIIO shall establish processes to maintain oversight over all
            outsourced functions, activities or operations, in order to minimise cybersecurity
            exposure arising from such outsourcing.
      - id: ccop-3.10.3
        class: ccop-provision
        title: CCoP 3.10.3
        props:
        - name: label
          value: 3.10.3
        - name: source-page
          value: '26'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.10.3_smt
          name: statement
          prose: 'The CII shall include terms in its agreement(s) with the external
            party to help ensure the cybersecurity of the CII and to reduce or mitigate
            the impact of any cybersecurity risks associated with the outsourcing,
            including risks associated with the external party’s access to the CII
            and its operations, processing, storage, communications and other functions.
            This shall include terms stipulating: (a) The type(s) of access that the
            external party has to the CII, taking into account the CIIO’s business
            requirements and the cybersecurity risk profile of the CII; (b) The obligations
            of the external party to protect the CII against cybersecurity threats
            and report cybersecurity incidents; and (c) The rights of the CIIO to
            commission an audit of the external party’s cybersecurity posture in relation
            to the outsourced functions, activities or operations; or to require that
            the external party provide a copy of the audit report should the external
            party commission its own audit for these purposes.'
      - id: ccop-3.10.4
        class: ccop-provision
        title: CCoP 3.10.4
        props:
        - name: label
          value: 3.10.4
        - name: source-page
          value: '27'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.10.4_smt
          name: statement
          prose: The CIIO shall establish processes for validating the external party’s
            compliance with the terms required under clause 3.10.3 and any other terms
            in the agreement relating to cybersecurity.
      - id: ccop-3.10.5
        class: ccop-provision
        title: CCoP 3.10.5
        props:
        - name: label
          value: 3.10.5
        - name: source-page
          value: '27'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-3.10.5_smt
          name: statement
          prose: The CIIO shall ensure that it is able to renegotiate the terms of
            its agreements(s) with external parties in the event of new legal or regulatory
            requirements.
  - id: ccop-g-4
    class: ccop-section
    title: IDENTIFICATION REQUIREMENTS
    props:
    - name: label
      value: '4'
    parts:
    - id: ccop-g-4_overview
      name: overview
      prose: Identification requirements aim to assist the CIIO in understanding and
        identifying the resources and assets supporting the CIIO’s critical business
        functions in delivering essential services, and the associated cybersecurity
        risks. It enables the CIIO to focus and prioritise its efforts in protecting
        these assets.
    groups:
    - id: ccop-g-4.1
      class: ccop-subsection
      title: Asset Management
      props:
      - name: label
        value: '4.1'
      parts:
      - id: ccop-g-4.1_overview
        name: overview
        prose: Asset management includes creating and maintaining a comprehensive
          inventory of all CII assets, including hardware, software, assets’ dependencies,
          and connections with any systems or networks. This is a key component in
          ensuring cybersecurity as it provides visibility of CII assets and allows
          operators to make informed decisions and prioritise assets for protection.
          In addition, changes to CII asset or information recorded needs to be updated
          in the asset inventory in a timely manner to ensure that inventory is up
          to date.
      controls:
      - id: ccop-4.1.1
        class: ccop-provision
        title: CCoP 4.1.1
        props:
        - name: label
          value: 4.1.1
        - name: source-page
          value: '28'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-4.1.1_smt
          name: statement
          prose: 'The CIIO shall establish mechanisms and processes to identify all
            CII assets and maintain an inventory of the assets. The inventory shall
            include the following: (a) Owner and/or operator of each CII asset; (b)
            Name and description of each CII asset; (c) Description of critical functions
            of each CII asset; (d) Key person(s) responsible for the cybersecurity
            of each CII asset; (e) The dependencies of each CII asset and the connections
            between each CII asset and any systems or networks (whether internal or
            external to the CII); (f) Physical location of each CII asset; (g) Outsourced
            service providers used to support each CII asset; (h) Cloud services used
            to support each CII asset. (i) Description of the internet links supporting
            the CII, including information on the distributed denial-of-service (DDoS)
            attack mitigation measures in place for these internet links; and (j)
            CII network topology diagram, including the CII network perimeter, and
            all external computers and computer systems that the CII interfaces with.'
      - id: ccop-4.1.2
        class: ccop-provision
        title: CCoP 4.1.2
        props:
        - name: label
          value: 4.1.2
        - name: source-page
          value: '29'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-4.1.2_smt
          name: statement
          prose: The CIIO shall establish mechanisms and processes to identify systems
            that the CIIO owns, operates, and/or controls that interconnects with
            or communicates with the CII.
      - id: ccop-4.1.3
        class: ccop-provision
        title: CCoP 4.1.3
        props:
        - name: label
          value: 4.1.3
        - name: source-page
          value: '29'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-4.1.3_smt
          name: statement
          prose: The CIIO shall establish an inventory of systems that the CIIO owns,
            operates, and/or controls that interconnects with or communicates with
            the CII and update the inventory in a timely manner whenever there is
            a material change to any CII asset that requires corresponding updates
            to the systems that interconnects with or communicates with the CII.
      - id: ccop-4.1.4
        class: ccop-provision
        title: CCoP 4.1.4
        props:
        - name: label
          value: 4.1.4
        - name: source-page
          value: '29'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-4.1.4_smt
          name: statement
          prose: The CIIO shall establish and maintain oversight for systems that
            the CIIO owns, operates, and/or controls that interconnects with or communicates
            with the CII.
  - id: ccop-g-5
    class: ccop-section
    title: PROTECTION REQUIREMENTS
    props:
    - name: label
      value: '5'
    parts:
    - id: ccop-g-5_overview
      name: overview
      prose: Protection requirements help the CIIO understand and implement the required
        people, process, and technology controls to protect the CII and to limit and
        contain the impact of cybersecurity incidents.
    groups:
    - id: ccop-g-5.1
      class: ccop-subsection
      title: Access Control
      props:
      - name: label
        value: '5.1'
      parts:
      - id: ccop-g-5.1_overview
        name: overview
        prose: Access control involves safeguarding CII assets from unauthorised access.
          By deploying access management mechanisms and processes, the CIIO ensure
          that only authorised parties can access protected systems, information and
          applications. Access control includes the steps of Identification, Authentication
          and Authorisation.
      controls:
      - id: ccop-5.1.1
        class: ccop-provision
        title: CCoP 5.1.1
        props:
        - name: label
          value: 5.1.1
        - name: source-page
          value: '30'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.1.1_smt
          name: statement
          prose: The CIIO shall ensure that access to the CII and between parts of
            the CII is restricted to authorised personnel, activities, processes and
            devices.
      - id: ccop-5.1.2
        class: ccop-provision
        title: CCoP 5.1.2
        props:
        - name: label
          value: 5.1.2
        - name: source-page
          value: '30'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.1.2_smt
          name: statement
          prose: With respect to the CIIO’s obligations under clause 5.1.1, the CIIO
            shall put in place authorisation and authentication controls for any access
            to the CII and between parts of the CII commensurate with the cybersecurity
            risk profile of the CII.
      - id: ccop-5.1.3
        class: ccop-provision
        title: CCoP 5.1.3
        props:
        - name: label
          value: 5.1.3
        - name: source-page
          value: '30'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.1.3_smt
          name: statement
          prose: 'The CIIO shall ensure that all external parties’ access to the CII
            are: (a) Documented and pre-approved; (b) Supervised by the CIIO; and
            (c) Performed on-site.'
      - id: ccop-5.1.4
        class: ccop-provision
        title: CCoP 5.1.4
        props:
        - name: label
          value: 5.1.4
        - name: source-page
          value: '30'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.1.4_smt
          name: statement
          prose: The CIIO shall implement mechanisms to automatically terminate logon
            sessions after inactivity for a pre-defined time. If the logon sessions
            cannot be terminated, the CIIO shall monitor the logon sessions for anomalous
            activities and trigger an alert for investigation when any anomaly is
            detected.
    - id: ccop-g-5.2
      class: ccop-subsection
      title: Account Management
      props:
      - name: label
        value: '5.2'
      parts:
      - id: ccop-g-5.2_overview
        name: overview
        prose: Account management is about the requirements in the creation, monitoring,
          maintenance and retirement of a user, application, service or system account
          that has access to the CII. Asset owners should determine appropriate access
          rights for each specific account while taking into consideration the associated
          cybersecurity risks. Accounts should not be granted excessive and unnecessary
          privileges to prevent unauthorised access. In addition, processes need to
          be established to detect unauthorised activities.
      controls:
      - id: ccop-5.2.1
        class: ccop-provision
        title: CCoP 5.2.1
        props:
        - name: label
          value: 5.2.1
        - name: source-page
          value: '31'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.2.1_smt
          name: statement
          prose: 'With respect to accounts that have access to the CII, including
            any user, application, service or system account, the CIIO shall: (a)
            Grant to each account only the minimum privileges necessary for its assigned
            functions and uses; (b) Ensure that rights to install software are granted
            only to accounts that have been authorised to do so; (c) Ensure that shared
            user accounts are not created unless necessary for operating the CII;
            (d) Establish mechanisms and processes to monitor the activities of each
            account, including behavioural patterns, for any anomalies and to trigger
            an alert for investigation when any anomaly is detected; and (e) Delete
            or disable any account that is no longer necessary or is inactive.'
      - id: ccop-5.2.2
        class: ccop-provision
        title: CCoP 5.2.2
        props:
        - name: label
          value: 5.2.2
        - name: source-page
          value: '31'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.2.2_smt
          name: statement
          prose: The CIIO shall perform a review of all accounts that have access
            to the CII to evaluate the validity of accounts and to ensure that privileges
            assigned to each account are required to support operational or business
            activities. The CIIO shall perform this review at least once every 12
            months. The first instance of this review is to be completed no later
            than 12 months after the Compliance Date.
    - id: ccop-g-5.3
      class: ccop-subsection
      title: Privileged Access Management
      props:
      - name: label
        value: '5.3'
      parts:
      - id: ccop-g-5.3_overview
        name: overview
        prose: Privileged accounts on a network are prime targets for malicious exploitation
          because they usually have more authority and access to resources. An attacker
          who has access to these accounts could potentially move about in the network
          and access privileged resources to gain unauthorised and persistent access
          to the entire system. Therefore, privileged access must be subject to tighter
          access control and greater monitoring.
      controls:
      - id: ccop-5.3.1
        class: ccop-provision
        title: CCoP 5.3.1
        props:
        - name: label
          value: 5.3.1
        - name: source-page
          value: '32'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.3.1_smt
          name: statement
          prose: 'With respect to privileged accounts, the CIIO shall: (a) Ensure
            that privileged access (i.e., administrative access) is granted only to
            selected accounts authorised to have such access; (b) Ensure that privileged
            access is initiated from a cybersecurity hardened environment and transfer
            of data takes place over authorised connections; (c) Maintain an updated
            inventory of privileged accounts including details of the permissions
            and privileges assigned to each account; (d) Implement multi-factor authentication
            where privileged accounts are used to access the CII, and where privileges
            are to be escalated to the level of privileged access (e.g., where the
            user seeks to obtain additional permissions on a system or network after
            an initial log-in); (e) Prohibit the sharing of privileged accounts used
            by network and system administrators, and any other personnel with privileged
            access, and establish processes to detect and remediate instances of account
            sharing. (f) Restrict use of “break glass” account(s) to emergency administrative
            use only where normal administrative access is unavailable. Access to
            such accounts shall be protected with access controls (e.g. “break glass”
            account password management process), logging and post-use review to ensure
            accountability.'
    - id: ccop-g-5.4
      class: ccop-subsection
      title: Domain Controller
      props:
      - name: label
        value: '5.4'
      parts:
      - id: ccop-g-5.4_overview
        name: overview
        prose: Domain controllers are servers that are responsible for authenticating
          user access to a network. During a cybersecurity incident, the domain controller
          is one of the primary targets as it contains data that a cyber threat actor
          could use to cause massive damage. Therefore, it is important to have mechanisms
          in place to monitor for anomalies.
      controls:
      - id: ccop-5.4.1
        class: ccop-provision
        title: CCoP 5.4.1
        props:
        - name: label
          value: 5.4.1
        - name: source-page
          value: '33'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.4.1_smt
          name: statement
          prose: 'The CIIO shall implement mechanisms and processes to: (a) Monitor
            for changes to the trust relationships established between domains; and
            (b) Identify anomalies in the trust relationships and trigger an alert
            for investigation when any anomaly is detected'
    - id: ccop-g-5.5
      class: ccop-subsection
      title: Network Segmentation
      props:
      - name: label
        value: '5.5'
      parts:
      - id: ccop-g-5.5_overview
        name: overview
        prose: Network segmentation is the separation of a network into different
          segments based on their security and risk levels, and controlling communication
          between them. By using data flow control devices or solutions at network
          intersections and limiting traffic allowed into and out of any given segment,
          network segmentation makes it difficult for a cyber threat actor to traverse
          the entire network to perform malicious activities such as reconnaissance
          work and data theft.
      controls:
      - id: ccop-5.5.1
        class: ccop-provision
        title: CCoP 5.5.1
        props:
        - name: label
          value: 5.5.1
        - name: source-page
          value: '33'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.5.1_smt
          name: statement
          prose: The CIIO shall segment the network architecture of the CII into different
            network segments based on their different security and risk levels.
      - id: ccop-5.5.2
        class: ccop-provision
        title: CCoP 5.5.2
        props:
        - name: label
          value: 5.5.2
        - name: source-page
          value: '33'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.5.2_smt
          name: statement
          prose: The CIIO shall limit any communications between the different network
            segments of a CII to only the minimum necessary for operating the CII.
      - id: ccop-5.5.3
        class: ccop-provision
        title: CCoP 5.5.3
        props:
        - name: label
          value: 5.5.3
        - name: source-page
          value: '33'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.5.3_smt
          name: statement
          prose: 'The CIIO shall: (a) Implement network security mechanisms between
            the different network segments of the CII to detect and block malicious
            network traffic and to secure network communications; and (b) Establish
            mechanisms and processes to isolate affected network segments of the CII
            in the event of a cybersecurity incident.'
    - id: ccop-g-5.6
      class: ccop-subsection
      title: Network Security
      props:
      - name: label
        value: '5.6'
      parts:
      - id: ccop-g-5.6_overview
        name: overview
        prose: Network security measures exist to restrict traffic flowing between
          different trust domains such as an organisation’s internal network and the
          outside world to protect the network and data from breaches, intrusions,
          and cybersecurity threats. In addition, the organisation should also have
          boundaries between internal trust domains which must be identified and controlled.
          Examples include designing and configuring the network in a manner that
          secures access to and from the CII.
      controls:
      - id: ccop-5.6.1
        class: ccop-provision
        title: CCoP 5.6.1
        props:
        - name: label
          value: 5.6.1
        - name: source-page
          value: '34'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.6.1_smt
          name: statement
          prose: The CIIO shall establish and implement network access control rules
            for the CII and perform periodic reviews to ensure they remain appropriate
            and up-to-date. The frequency of the review shall be commensurate with
            the cybersecurity risk profile of the CII.
      - id: ccop-5.6.2
        class: ccop-provision
        title: CCoP 5.6.2
        props:
        - name: label
          value: 5.6.2
        - name: source-page
          value: '34'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.6.2_smt
          name: statement
          prose: 'The CIIO shall ensure that the CII is not connected to any network
            outside of the CII except where necessary for operating the CII. Where
            such connections are necessary, the CIIO shall: (a) Implement network
            security mechanisms between the CII and the network to detect and block
            malicious network traffic and to secure network communications; and (b)
            Restrict the direction of data flow to only one-way if only one-way data
            flow is required for the operations of the CII.'
      - id: ccop-5.6.3
        class: ccop-provision
        title: CCoP 5.6.3
        props:
        - name: label
          value: 5.6.3
        - name: source-page
          value: '34'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.6.3_smt
          name: statement
          prose: The CIIO shall ensure that the CII is not connected to the internet
            except where required for operating the CII to deliver essential services.
            Where connection to the internet is required, the CIIO shall implement
            appropriate measures to mitigate and reduce cybersecurity risks arising
            from any such connection.
    - id: ccop-g-5.7
      class: ccop-subsection
      title: Remote Connection
      props:
      - name: label
        value: '5.7'
      parts:
      - id: ccop-g-5.7_overview
        name: overview
        prose: Remote connection is the access to a non-public computing resource
          by a user (or a process acting on behalf of a user) communicating through
          an external network. For example, accessing a network in a CII to perform
          administration or maintenance from an external network. It is important
          to secure this access because it acts as a direct conduit into the CII.
          A secured conduit would make it difficult for a cyber threat actor to gain
          a foothold in the CII, denying the cyber threat actor the platform to perform
          reconnaissance for intelligence gathering and to take actions that adversely
          impact the CII.
      controls:
      - id: ccop-5.7.1
        class: ccop-provision
        title: CCoP 5.7.1
        props:
        - name: label
          value: 5.7.1
        - name: source-page
          value: '34'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.7.1_smt
          name: statement
          prose: The CIIO shall put in place effective cybersecurity measures for
            all remote connections to the CII to prevent and detect unauthorised access,
            and to validate that all such remote connections are authorised.
      - id: ccop-5.7.2
        class: ccop-provision
        title: CCoP 5.7.2
        props:
        - name: label
          value: 5.7.2
        - name: source-page
          value: '35'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.7.2_smt
          name: statement
          prose: 'The CIIO shall ensure that: (a) Remote connections to the CII are
            disabled except where necessary for operating the CII; (b) Multi-factor
            authentication is required for the establishing a remote connection to
            the CII; (c) Remote connections to the CII have strong encryption and
            are made only through secured intermediary mechanisms; (d) Measures are
            put in place to ensure transmission security and message integrity over
            the remote connection; (e) Files to be uploaded to the CII are scanned
            for malware before being uploaded; and (f) Data flows over remote connections
            to the CII are limited to only the minimum necessary for performing the
            function required of the connection.'
    - id: ccop-g-5.8
      class: ccop-subsection
      title: Wireless Communication
      props:
      - name: label
        value: '5.8'
      parts:
      - id: ccop-g-5.8_overview
        name: overview
        prose: The use of wireless communications may be required within a CII, for
          example, due to physical constraints. However, this creates an additional
          attack vector that could be used by a cyber threat actor to gain entry to
          the network and to exfiltrate information or disrupt services. Moreover,
          wireless transmission of data presents the risk of data being intercepted.
          Controls need to be implemented to monitor for and prevent unauthorised
          access to the wireless network and data.
      controls:
      - id: ccop-5.8.1
        class: ccop-provision
        title: CCoP 5.8.1
        props:
        - name: label
          value: 5.8.1
        - name: source-page
          value: '35'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.8.1_smt
          name: statement
          prose: 'The CIIO shall ensure that the CII is not connected to any wireless
            Local Area Network (LAN) except where necessary for operating the CII.
            Where any such connection is necessary, the CIIO shall ensure that: (a)
            Only authorised wireless LAN is used; (b) The connection has strong encryption;
            and (c) Only authorised devices (whether such devices are CII assets or
            otherwise) are allowed to connect to the wireless LAN.'
    - id: ccop-g-5.9
      class: ccop-subsection
      title: System Hardening
      props:
      - name: label
        value: '5.9'
      parts:
      - id: ccop-g-5.9_overview
        name: overview
        prose: A typical CII environment may consist of numerous systems of different
          makes and models. Servers, consoles, workstations, appliances, network devices
          and field devices, in their default state, are not secured. Unnecessary
          services and programs are often left unmonitored, and they are potential
          avenues for a cyber threat actor to exploit. System hardening measures reduce
          the likelihood for the cyber threat actor to exploit vulnerabilities on
          assets that could lead to the compromise of the CII.
      controls:
      - id: ccop-5.9.1
        class: ccop-provision
        title: CCoP 5.9.1
        props:
        - name: label
          value: 5.9.1
        - name: source-page
          value: '36'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.9.1_smt
          name: statement
          prose: 'In respect of the following types of CII assets as they may be found
            in the CII, the CIIO shall establish and implement a security configuration
            baseline for each asset that is commensurate with the cybersecurity risk
            profile of the CII: (a) Operating systems; (b) Appliances; (c) Consoles
            and workstations, including Human Machine Interfaces (HMI) and OT engineering
            workstations; (d) Network devices; (e) Servers, including alarm servers,
            OT historians and management servers; (f) Software applications; and (g)
            Any other CII asset or type of asset identified by the Commissioner.'
      - id: ccop-5.9.2
        class: ccop-provision
        title: CCoP 5.9.2
        props:
        - name: label
          value: 5.9.2
        - name: source-page
          value: '36'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.9.2_smt
          name: statement
          prose: 'The security configuration baselines shall minimally address the
            following security practices: (a) Account management - disable or remove
            default accounts, guest accounts, inactive accounts and unused accounts;
            (b) Password and passphrase management – Default passwords shall be changed;
            passwords and passphrases shall be stored using in their hash forms; (c)
            Application control – Disable services and remove applications that are
            not necessary for the operation of the CII; (d) Port(s) and service(s)
            management – Enable only ports and services that are necessary for the
            operation of the CII; (e) Physical connection - Enable only external physical
            connections that are necessary for the operation of the CII; (f) Malware
            protection – Install and update to the latest version of anti-malware
            software with the latest anti-malware signatures; and (g) Software upgrade
            and update - Timely upgrade and update of software and security patches
            .'
      - id: ccop-5.9.3
        class: ccop-provision
        title: CCoP 5.9.3
        props:
        - name: label
          value: 5.9.3
        - name: source-page
          value: '37'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.9.3_smt
          name: statement
          prose: The CIIO shall review the security configuration baselines at least
            once every 12 months to ensure that the baselines remain effective in
            ensuring the cybersecurity of the CII. The first instance of this review
            is to be completed no later than 12 months from the time the baselines
            are established.
      - id: ccop-5.9.4
        class: ccop-provision
        title: CCoP 5.9.4
        props:
        - name: label
          value: 5.9.4
        - name: source-page
          value: '37'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.9.4_smt
          name: statement
          prose: The CIIO shall ensure that only authorised computing devices are
            used for the administration of the CII, and such devices are not used
            for other, non-administrative purposes.
    - id: ccop-g-5.10
      class: ccop-subsection
      title: Patch Management
      props:
      - name: label
        value: '5.10'
      parts:
      - id: ccop-g-5.10_overview
        name: overview
        prose: Patch management is the process for identifying, obtaining, installing
          and verifying updates and upgrades to firmware and software. Timely application
          of security patches limits the opportunity for a cyber threat actor to exploit
          vulnerabilities. Hence, it is important for organisations to monitor for
          new vulnerabilities and their corresponding security patches, and to develop
          procedures to prioritise and apply the security patches promptly. Furthermore,
          patches shall be verified and tested prior to installation in the production
          environment and monitored post-installation. Management support is critical
          to ensure there is oversight on the effectiveness of the security patch
          management process. The management of the CIIO should closely monitor the
          reporting status so as to manage the risk exposure arising from unpatched
          vulnerabilities.
      controls:
      - id: ccop-5.10.1
        class: ccop-provision
        title: CCoP 5.10.1
        props:
        - name: label
          value: 5.10.1
        - name: source-page
          value: '37'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.10.1_smt
          name: statement
          prose: 'The CIIO shall establish and implement a security patch management
            process that includes: (a) Monitoring the release of security patches
            for CII assets; (b) Verifying the integrity of the security patches; (c)
            Testing security patches in a test environment that is similar to the
            CII production environment to ensure that the patches do not negatively
            affect the operations and cybersecurity of the CII; (d) Prioritising the
            application of security patches based on the level of risk posed to the
            operations of the CII; (e) Applying security patches in a timely manner
            to reduce cybersecurity vulnerabilities; (f) Monitoring and tracking the
            progress of patching; (g) Applying compensating controls to mitigate and
            reduce cybersecurity risks in cases where a security patch cannot be applied;
            and (h) Rolling back the application of security patches where necessary.'
      - id: ccop-5.10.2
        class: ccop-provision
        title: CCoP 5.10.2
        props:
        - name: label
          value: 5.10.2
        - name: source-page
          value: '38'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.10.2_smt
          name: statement
          prose: The CIIO shall ensure that there is management oversight over the
            effectiveness of the security patch management processes.
    - id: ccop-g-5.11
      class: ccop-subsection
      title: Portable Computing Devices and Removable Storage Media
      props:
      - name: label
        value: '5.11'
      parts:
      - id: ccop-g-5.11_overview
        name: overview
        prose: Portable computing devices and portable media are convenient media
          to facilitate data transfers, but are also an effective means for malware
          delivery. Organisations that allow the use of portable computing devices
          and removable storage media in their computing environment run the risk
          of malware infections through such media. It is therefore crucial that portable
          computing devices and removable media devices be hardened, verified, and
          their use be restricted and controlled to reduce the likelihood of a cyber
          threat actor succeeding in using such media as an attack vector to the CII.
          In addition, sensitive information stored in the portable computing devices
          and removable media devices ought to be encrypted to ensure confidentiality
          of the data in the event that these devices were compromised or lost.
      controls:
      - id: ccop-5.11.1
        class: ccop-provision
        title: CCoP 5.11.1
        props:
        - name: label
          value: 5.11.1
        - name: source-page
          value: '38'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.11.1_smt
          name: statement
          prose: The CIIO shall establish processes to authorise and track the use
            of portable computing devices and removable storage media that connect
            to the CII.
      - id: ccop-5.11.2
        class: ccop-provision
        title: CCoP 5.11.2
        props:
        - name: label
          value: 5.11.2
        - name: source-page
          value: '38'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.11.2_smt
          name: statement
          prose: The CIIO shall ensure that all such authorised portable computing
            devices adhere to a security configuration baseline that minimally addresses
            the security practices listed in clause 5.9.2, and satisfies any other
            security standards and requirements which the CIIO may have for such devices.
      - id: ccop-5.11.3
        class: ccop-provision
        title: CCoP 5.11.3
        props:
        - name: label
          value: 5.11.3
        - name: source-page
          value: '38'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.11.3_smt
          name: statement
          prose: The CIIO shall ensure that authorised removable storage media are
            free of malware prior to connecting to the CII.
      - id: ccop-5.11.4
        class: ccop-provision
        title: CCoP 5.11.4
        props:
        - name: label
          value: 5.11.4
        - name: source-page
          value: '38'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.11.4_smt
          name: statement
          prose: The CIIO shall ensure that sensitive information relating to the
            CII (including production data and system configuration information) that
            is stored in portable computing devices and removable storage media is
            secured with strong encryption.
    - id: ccop-g-5.12
      class: ccop-subsection
      title: Application Security
      props:
      - name: label
        value: '5.12'
      parts:
      - id: ccop-g-5.12_overview
        name: overview
        prose: As software becomes increasingly complex and connected, the difficulty
          of achieving application security increases exponentially. Attackers can
          potentially use many different paths through the applications used in the
          CII environment to do harm to the CIIO’s businesses or organisation. As
          such, application security which describes cybersecurity measures and practices
          at the application level should be adopted to secure the application code
          and data. The Open Web Application Security Project (OWASP) is one of the
          effective steps towards producing more secure code and minimise application
          security risks. To further secure web applications from malicious cyber
          threat actors, web application firewall (WAF) should be deployed to protect
          web application systems that are internet-facing to mitigate web vulnerabilities.
          In addition, multi-tier architecture should be put in place to separate
          the application and database tier to improve scalability, security and resiliency.
      controls:
      - id: ccop-5.12.1
        class: ccop-provision
        title: CCoP 5.12.1
        props:
        - name: label
          value: 5.12.1
        - name: source-page
          value: '39'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.12.1_smt
          name: statement
          prose: The CIIO shall ensure that only applications that are necessary for
            the operation and cybersecurity of the CII and that have been approved
            by the CIIO are used in the CII. The CIIO shall establish and maintain
            a list of such approved applications.
      - id: ccop-5.12.2
        class: ccop-provision
        title: CCoP 5.12.2
        props:
        - name: label
          value: 5.12.2
        - name: source-page
          value: '39'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.12.2_smt
          name: statement
          prose: The CIIO shall review the list of approved applications at least
            once every 12 months. The first instance of this review is to be completed
            no later than 12 months from the time the list is established.
      - id: ccop-5.12.3
        class: ccop-provision
        title: CCoP 5.12.3
        props:
        - name: label
          value: 5.12.3
        - name: source-page
          value: '39'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.12.3_smt
          name: statement
          prose: The CIIO shall verify the integrity of applications before they are
            used in the CII.
      - id: ccop-5.12.4
        class: ccop-provision
        title: CCoP 5.12.4
        props:
        - name: label
          value: 5.12.4
        - name: source-page
          value: '39'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.12.4_smt
          name: statement
          prose: For a CII which is an IT system, the CIIO shall implement multi-tier
            architecture that separates the application and database tiers and implement
            security controls at each tier.
      - id: ccop-5.12.5
        class: ccop-provision
        title: CCoP 5.12.5
        props:
        - name: label
          value: 5.12.5
        - name: source-page
          value: '39'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.12.5_smt
          name: statement
          prose: For a CII that includes web application systems, the CIIO shall reference
            the latest Open Web Application Security Project (OWASP) or equivalent
            application security guidelines when designing, developing and testing
            applications to minimise application security risks.
      - id: ccop-5.12.6
        class: ccop-provision
        title: CCoP 5.12.6
        props:
        - name: label
          value: 5.12.6
        - name: source-page
          value: '39'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.12.6_smt
          name: statement
          prose: For a CII that includes web application systems that are internet-facing,
            the CIIO shall also implement a Web Application Firewall (WAF) to monitor
            for, detect and block web application threats.
      - id: ccop-5.12.7
        class: ccop-provision
        title: CCoP 5.12.7
        props:
        - name: label
          value: 5.12.7
        - name: source-page
          value: '39'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.12.7_smt
          name: statement
          prose: The CIIO shall ensure that compilers and debuggers are used in the
            CII only where necessary and only on devices authorised for such purposes.
            Compilers and debuggers shall be removed when they are no longer required.
    - id: ccop-g-5.13
      class: ccop-subsection
      title: Database Security
      props:
      - name: label
        value: '5.13'
      parts:
      - id: ccop-g-5.13_overview
        name: overview
        prose: Critical data is often stored in a database. While databases are not
          typically attacked directly, requests for data from applications, malicious
          or not, is often passed to them. For example, SQL injection or cross-site
          scripting are attacks that attempt to retrieve data or bypass authentication
          related to a database. Knowing these types of cyber-attacks are commonplace,
          measures need to be taken to secure a database. Database security describes
          cybersecurity measures that aim to secure the confidentiality, integrity
          and availability of data stored in a database. For example, granular access
          control should be applied to the entire database, specific tables, or even
          in some specific columns or records to ensure only authorised accounts can
          connect to and query the data in the database. In addition, an individual
          should not be both a database administrator and system administrator as
          excessive access could increase the risk of abuse if the access is misused
          or compromised. Therefore, segregation of duties must be in place to ensure
          to checks and balances for preventing fraud and errors. Furthermore, database
          logging and activity monitoring tools are important in detecting unauthorised
          access, manipulation, exfiltration or destruction of data.
      controls:
      - id: ccop-5.13.1
        class: ccop-provision
        title: CCoP 5.13.1
        props:
        - name: label
          value: 5.13.1
        - name: source-page
          value: '40'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.13.1_smt
          name: statement
          prose: The CIIO shall ensure that only authorised accounts can connect to
            and query databases in a CII.
      - id: ccop-5.13.2
        class: ccop-provision
        title: CCoP 5.13.2
        props:
        - name: label
          value: 5.13.2
        - name: source-page
          value: '40'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.13.2_smt
          name: statement
          prose: The CIIO shall ensure that duties relating to system administration
            and database administration for the CII are segregated and assigned to
            different persons.
      - id: ccop-5.13.3
        class: ccop-provision
        title: CCoP 5.13.3
        props:
        - name: label
          value: 5.13.3
        - name: source-page
          value: '40'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.13.3_smt
          name: statement
          prose: 'The CIIO shall establish policies to secure databases in a CII,
            including policies for: (a) Securing data at rest; (b) Preventing data
            exfiltration; and (c) Restricting access to sensitive data to authorised
            persons.'
      - id: ccop-5.13.4
        class: ccop-provision
        title: CCoP 5.13.4
        props:
        - name: label
          value: 5.13.4
        - name: source-page
          value: '40'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.13.4_smt
          name: statement
          prose: The CIIO shall monitor databases in a CII for anomalous activities
            and trigger an alert for investigation when any anomaly is detected.
      - id: ccop-5.13.5
        class: ccop-provision
        title: CCoP 5.13.5
        props:
        - name: label
          value: 5.13.5
        - name: source-page
          value: '40'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.13.5_smt
          name: statement
          prose: The CIIO shall monitor for bulk queries that exceed a predetermined
            threshold of data to be retrieved and trigger an alert for investigation
            when any such bulk query is detected.
    - id: ccop-g-5.14
      class: ccop-subsection
      title: Vulnerability Assessment
      props:
      - name: label
        value: '5.14'
      parts:
      - id: ccop-g-5.14_overview
        name: overview
        prose: Vulnerability assessment is a process of identifying, assessing and
          discovering security vulnerabilities on a computer system, including IT
          and OT systems or networks. The systematic approach of identifying, quantifying,
          and ranking security vulnerabilities enables an organisation to select critical
          vulnerabilities to resolve based on its available resources and the risks
          posed. To ensure timely remediation of the security vulnerabilities, organisations
          should conduct vulnerability assessment regularly and when there are major
          system changes to their systems or networks to identify and mitigate flaws
          that may be exploited during a cyber-attack.
      controls:
      - id: ccop-5.14.1
        class: ccop-provision
        title: CCoP 5.14.1
        props:
        - name: label
          value: 5.14.1
        - name: source-page
          value: '41'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.14.1_smt
          name: statement
          prose: The CIIO shall establish processes to identify and track cybersecurity
            vulnerabilities of the CII.
      - id: ccop-5.14.2
        class: ccop-provision
        title: CCoP 5.14.2
        props:
        - name: label
          value: 5.14.2
        - name: source-page
          value: '41'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.14.2_smt
          name: statement
          prose: The CIIO shall remediate all cybersecurity vulnerabilities in a timely
            manner, with priority given to vulnerabilities that pose a greater risk
            to the security or operations of the CII.
      - id: ccop-5.14.3
        class: ccop-provision
        title: CCoP 5.14.3
        props:
        - name: label
          value: 5.14.3
        - name: source-page
          value: '41'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.14.3_smt
          name: statement
          prose: 'The CIIO shall conduct a vulnerability assessment of the CII: (a)
            for a CII which is an IT system - at least once every 12 months, with
            the first instance to be completed by the Compliance Date; and (b) for
            a CII which is an OT system - at least once every 24 months, with the
            first instance to be completed no later than 12 months after the Compliance
            Date.'
      - id: ccop-5.14.4
        class: ccop-provision
        title: CCoP 5.14.4
        props:
        - name: label
          value: 5.14.4
        - name: source-page
          value: '41'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.14.4_smt
          name: statement
          prose: The CIIO shall also conduct a vulnerability assessment for relevant
            CII assets after implementing any major system changes to the CII. Major
            system changes include commissioning new systems to be connected to the
            CII, implementing new application modules, system upgrades and technology
            refresh.
      - id: ccop-5.14.5
        class: ccop-provision
        title: CCoP 5.14.5
        props:
        - name: label
          value: 5.14.5
        - name: source-page
          value: '41'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.14.5_smt
          name: statement
          prose: The CIIO shall, if requested by the Commissioner, submit a copy of
            the report of any vulnerability assessment, along with the CIIO’s plans
            for remediating each vulnerability, to the Commissioner within 30 working
            days of receiving the request.
    - id: ccop-g-5.15
      class: ccop-subsection
      title: Penetration Testing
      props:
      - name: label
        value: '5.15'
      parts:
      - id: ccop-g-5.15_overview
        name: overview
        prose: Penetration testing is an authorised and intentional attack on a system
          to identify security vulnerabilities that could be exploited by a cyber
          threat actor. This allows organisations to determine exploitable vulnerabilities
          in their systems and address them. However, penetration testing services
          can be intrusive because the penetration testers will gain access to their
          CIIOs’ computer systems and networks and acquire a deep understanding of
          the systems’ vulnerabilities. Such service, if abused, can compromise and
          disrupt the systems and networks’ operations even after the service provider’s
          job has been completed. As such, CIIOs are required to ensure that the companies
          they engage to provide penetration testing services are accredited and that
          the penetration testers performing the tests are certified and competent.
      controls:
      - id: ccop-5.15.1
        class: ccop-provision
        title: CCoP 5.15.1
        props:
        - name: label
          value: 5.15.1
        - name: source-page
          value: '42'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.15.1_smt
          name: statement
          prose: 'The CIIO shall conduct a penetration test on the CII: (a) For a
            CII which is an IT system – at least once every 12 months, with the first
            instance to be completed by the Compliance Date; and (b) For a CII which
            is an OT system – at least once every 24 months, with the first instance
            to be completed no later than 12 months after the Compliance Date.'
      - id: ccop-5.15.2
        class: ccop-provision
        title: CCoP 5.15.2
        props:
        - name: label
          value: 5.15.2
        - name: source-page
          value: '42'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.15.2_smt
          name: statement
          prose: The CIIO shall also conduct penetration tests on relevant CII assets
            after implementing any major system changes to the CII. Major system changes
            include commissioning any new systems to be connected to the CII, implementing
            new application modules, system upgrades and technology refresh.
      - id: ccop-5.15.3
        class: ccop-provision
        title: CCoP 5.15.3
        props:
        - name: label
          value: 5.15.3
        - name: source-page
          value: '42'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.15.3_smt
          name: statement
          prose: 'The CIIO shall ensure that third-party penetration testing service
            providers and their penetration testers who are performing penetration
            tests on a CII possess industry-recognised accreditations and certifications
            respectively, for example CREST or equivalent accreditations and certifications:
            (a) Penetration testers performing the penetration tests must have industry-recognised
            penetration testing certification to demonstrate assurance of their knowledge
            and practical skills. (b) Service providers must have industry-recognised
            accreditation to demonstrate assurance of their policies and procedures
            in penetration testing service, reporting and data handling, and due diligence
            in hiring of ethical penetration testers.'
      - id: ccop-5.15.4
        class: ccop-provision
        title: CCoP 5.15.4
        props:
        - name: label
          value: 5.15.4
        - name: source-page
          value: '43'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.15.4_smt
          name: statement
          prose: The CIIO shall ensure that all penetration tests by third-party service
            providers are conducted under supervision of the CIIO to ensure that activities
            carried out by the service providers are within the intended scope of
            the penetration test and do not disrupt CII operations.
      - id: ccop-5.15.5
        class: ccop-provision
        title: CCoP 5.15.5
        props:
        - name: label
          value: 5.15.5
        - name: source-page
          value: '43'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.15.5_smt
          name: statement
          prose: The CIIO shall, if requested by the Commissioner, submit a copy of
            the report of any completed penetration test, along with the CIIO’s remediation
            plans, to the Commissioner within 30 working days of receiving the request.
    - id: ccop-g-5.16
      class: ccop-subsection
      title: Adversarial Attack Simulation
      props:
      - name: label
        value: '5.16'
      parts:
      - id: ccop-g-5.16_overview
        name: overview
        prose: Adversarial attack simulation is a cybersecurity assessment that simulates
          highly targeted attacks against an organisation’s cyber operating environment
          by sophisticated cyber threat actors. It replicates a cybersecurity attack
          based on cyber threat actors’ tactics, techniques and procedures. The goal
          is to assess and enhance the capability of an organisation to prevent, detect
          and respond to cybersecurity incidents.
      controls:
      - id: ccop-5.16.1
        class: ccop-provision
        title: CCoP 5.16.1
        props:
        - name: label
          value: 5.16.1
        - name: source-page
          value: '43'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.16.1_smt
          name: statement
          prose: 'The CIIO shall establish a red teaming or purple teaming attack
            simulation plan which identifies, among other things: (a) Objectives to
            be achieved; (b) Key stakeholders including red team, blue team and management
            team; (c) Assessment methodology, including planning and attack preparation,
            attack execution, clean-up and containment, blue team report and reconciliation,
            recommendations and remediation; (d) Rules of engagement (only for red
            teaming); (e) Mitigation measures to minimise potential business impact
            or disruption; and (f) Recovery plan.'
      - id: ccop-5.16.2
        class: ccop-provision
        title: CCoP 5.16.2
        props:
        - name: label
          value: 5.16.2
        - name: source-page
          value: '43'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.16.2_smt
          name: statement
          prose: The CIIO shall conduct a red teaming or purple teaming attack simulation
            on its CII at least once every 24 months to test and validate the effectiveness
            of its cybersecurity measures against prevalent cybersecurity threats.
            The first instance of the attack simulation is to be completed no later
            than 12 months after the Compliance Date.
      - id: ccop-5.16.3
        class: ccop-provision
        title: CCoP 5.16.3
        props:
        - name: label
          value: 5.16.3
        - name: source-page
          value: '43'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.16.3_smt
          name: statement
          prose: The CIIO shall, if requested by the Commissioner, submit a copy of
            the report of any completed red teaming or purple teaming attack simulation,
            along with the CIIO’s remediation plans, to the Commissioner within 30
            working days of receiving the request.
    - id: ccop-g-5.17
      class: ccop-subsection
      title: Cryptographic Key Management
      props:
      - name: label
        value: '5.17'
      parts:
      - id: ccop-g-5.17_overview
        name: overview
        prose: The management of cryptographic keys is crucial to the effectiveness
          of cryptographic techniques. Any compromise to the cryptographic keys could
          allow a cyber threat actor to decrypt classified information or obtain privileged
          accesses, which may lead to the failure of the organisation’s entire security
          infrastructure.
      controls:
      - id: ccop-5.17.1
        class: ccop-provision
        title: CCoP 5.17.1
        props:
        - name: label
          value: 5.17.1
        - name: source-page
          value: '44'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.17.1_smt
          name: statement
          prose: The CIIO shall ensure that all cryptographic keys for the CII are
            protected against unauthorised access.
      - id: ccop-5.17.2
        class: ccop-provision
        title: CCoP 5.17.2
        props:
        - name: label
          value: 5.17.2
        - name: source-page
          value: '44'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-5.17.2_smt
          name: statement
          prose: The CIIO shall establish and implement mechanisms and processes to
            track and manage the lifecycle of cryptographic keys. The CIIO shall review
            these mechanisms and processes at least once every 12 months to ensure
            their continued effectiveness. The first instance of this review is to
            be completed no later than 12 months from the time the mechanisms and
            processes are implemented.
  - id: ccop-g-6
    class: ccop-section
    title: DETECTION REQUIREMENTS
    props:
    - name: label
      value: '6'
    parts:
    - id: ccop-g-6_overview
      name: overview
      prose: Detection requirements aim to assist the CIIO in understanding and implementing
        the required people, process and technology controls to detect and identify
        any malicious activity or vulnerability that could compromise the CII, including
        any stepping-stone attacks and attacks against the crown jewels of the system.
        The CIIO must investigate and identify potential threats and determine the
        impact, root cause and controls for containing threats and incidents and fortifying
        CII.
    groups:
    - id: ccop-g-6.1
      class: ccop-subsection
      title: Logging
      props:
      - name: label
        value: '6.1'
      parts:
      - id: ccop-g-6.1_overview
        name: overview
        prose: Logging is the process of recording events occurring within a system
          or network and enables an organisation to perform investigations and threat
          hunting. For an organisation to establish and maintain successful log management
          activities, it is vital that polices are developed based on defined goals
          and requirements, including the logging scope and log generation, transmission,
          storage, retention and analysis.
      controls:
      - id: ccop-6.1.1
        class: ccop-provision
        title: CCoP 6.1.1
        props:
        - name: label
          value: 6.1.1
        - name: source-page
          value: '45'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-6.1.1_smt
          name: statement
          prose: 'The CIIO shall generate, collect and store logs of the following:
            (a) All access and attempts to access the CII and the activities during
            such access, including application and database activities, and access
            to data in the CII; (b) Network connections between the CII and networks
            outside of the CII; (c) Network connections within the CII; (d) Remote
            connections to the CII; and (e) Connections between the CII and wireless
            LAN.'
      - id: ccop-6.1.2
        class: ccop-provision
        title: CCoP 6.1.2
        props:
        - name: label
          value: 6.1.2
        - name: source-page
          value: '45'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-6.1.2_smt
          name: statement
          prose: 'The CIIO shall also generate, collect and store the following categories
            of logs to provide visibility of network activities within the CII and
            between the CII and networks outside of the CII: (a) Network Firewall
            logs; (b) Domain Name System (DNS) logs; (c) Web Proxy logs; and (d) Network
            Intrusion Detection/Prevention System (NIDS/NIPS) logs.'
      - id: ccop-6.1.3
        class: ccop-provision
        title: CCoP 6.1.3
        props:
        - name: label
          value: 6.1.3
        - name: source-page
          value: '45'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-6.1.3_smt
          name: statement
          prose: The CIIO shall provide any such logs referred to in clause 6.1.2
            as may be required by the Commissioner for threat monitoring, threat analysis,
            threat alerts, and incident response.
      - id: ccop-6.1.4
        class: ccop-provision
        title: CCoP 6.1.4
        props:
        - name: label
          value: 6.1.4
        - name: source-page
          value: '46'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-6.1.4_smt
          name: statement
          prose: 'The CIIO shall ensure that the logs generated, collected, and stored
            under clauses 6.1.1 and 6.1.2: (a) Use a consistent time source; (b) Are
            protected against unauthorised access, modification and deletion; (c)
            Are stored for a minimum period of 12 months after the date of the event
            to which the log relates; (d) Have a log file structure (i.e., the arrangement
            of data fields within each log file) that facilitates analysis and sharing
            of logs; and (e) Are governed by a log retention policy to facilitate
            investigations into cybersecurity incidents, the conduct of threat hunting,
            and any other purposes relating to the cybersecurity of the CII.'
    - id: ccop-g-6.2
      class: ccop-subsection
      title: Monitoring and Detection
      props:
      - name: label
        value: '6.2'
      parts:
      - id: ccop-g-6.2_overview
        name: overview
        prose: Monitoring of traffic and logs can help detect cybersecurity threats
          so that appropriate countermeasures can be deployed. To achieve an effective
          monitoring regime, it is vital that a baseline of normal operations is established
          to detect deviations with the use of indicators of compromise. In addition,
          with the fast-changing cybersecurity landscape, it is critical that the
          processes and mechanisms are being reviewed consistently. Threat detection
          coverage should therefore apply to the entire CIIO’s network, as cyber threats
          are not solely confined to designated segments, such as CII systems. Adversarial
          actors may exploit less-monitored segments of the network as entry points
          for lateral movement toward the CII network. It is thus vital that comprehensive
          visibility is maintained across the CIIO network to enable timely threat
          detection and response to mitigate cyber threats.
      controls:
      - id: ccop-6.2.1
        class: ccop-provision
        title: CCoP 6.2.1
        props:
        - name: label
          value: 6.2.1
        - name: source-page
          value: '46'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-6.2.1_smt
          name: statement
          prose: 'The CIIO shall establish and implement mechanisms and processes
            for the purposes of: (a) Monitoring and detecting all cybersecurity events
            in respect of the CII; (b) Collecting and storing records of all such
            cybersecurity events (including, where available, logs relating to the
            cybersecurity event); (c) Analysing all such cybersecurity events, including
            correlating between cybersecurity events, and determining whether there
            is or has been any cybersecurity incident; and (d) Triggering applicable
            incident reporting, response and recovery plans if there is or has been
            any cybersecurity incident.'
      - id: ccop-6.2.2
        class: ccop-provision
        title: CCoP 6.2.2
        props:
        - name: label
          value: 6.2.2
        - name: source-page
          value: '47'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-6.2.2_smt
          name: statement
          prose: 'For the purposes of monitoring and detecting cybersecurity events,
            the mechanisms and processes established by the CIIO shall include: (a)
            Scanning for indicators of compromise (IOCs), including IP addresses,
            Uniform Resource Locator (URL), domains and hashes; (b) Establishing the
            normal day-to-day operational activities and network traffic in the CII,
            and using this as a baseline against which the CIIO is to monitor for
            deviations and anomalous activities; and (c) Ensuring that alerts for
            further investigation are triggered for all deviations and anomalous activities
            that are detected.'
      - id: ccop-6.2.3
        class: ccop-provision
        title: CCoP 6.2.3
        props:
        - name: label
          value: 6.2.3
        - name: source-page
          value: '47'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-6.2.3_smt
          name: statement
          prose: The CIIO shall review the mechanisms and processes established under
            clause 6.2.1, including the baseline referred to in clause 6.2.2(b), at
            least once every 12 months, or as often as required based on the evolving
            cyber threat landscape, to ensure that the mechanisms and processes remain
            effective for their purposes. The first instance of this review is to
            be completed no later than 12 months from the time the mechanisms and
            processes are implemented.
      - id: ccop-6.2.4
        class: ccop-provision
        title: CCoP 6.2.4
        props:
        - name: label
          value: 6.2.4
        - name: source-page
          value: '47'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-6.2.4_smt
          name: statement
          prose: The CIIO shall facilitate, if requested by the Commissioner, the
            deployment of CSA-supported threat detection systems across designated
            segments of the CIIO’s network.
    - id: ccop-g-6.3
      class: ccop-subsection
      title: Threat Hunting
      props:
      - name: label
        value: '6.3'
      parts:
      - id: ccop-g-6.3_overview
        name: overview
        prose: Threat hunting is a proactive effort to search for signs of malicious
          activity that have evaded security defences within the CII. The objective
          of threat hunting is to identify previously unknown or ongoing threats within
          the environment to limit the impact of potential cybersecurity incidents
          in the evolving cyber threat landscape.
      controls:
      - id: ccop-6.3.1
        class: ccop-provision
        title: CCoP 6.3.1
        props:
        - name: label
          value: 6.3.1
        - name: source-page
          value: '48'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-6.3.1_smt
          name: statement
          prose: The CIIO shall conduct threat hunting for the CII to search for and
            identify cybersecurity threats to the CII at least once every 24 months.
            The first instance of threat hunting is to be completed no later than
            12 months after the Compliance Date.
      - id: ccop-6.3.2
        class: ccop-provision
        title: CCoP 6.3.2
        props:
        - name: label
          value: 6.3.2
        - name: source-page
          value: '48'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-6.3.2_smt
          name: statement
          prose: The CIIO shall include cybersecurity threats identified from threat
            hunting in cybersecurity risk assessments to ensure that the risks derived
            from the threats are assessed, mitigated, and tracked throughout the CII’s
            system development lifecycle.
      - id: ccop-6.3.3
        class: ccop-provision
        title: CCoP 6.3.3
        props:
        - name: label
          value: 6.3.3
        - name: source-page
          value: '48'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-6.3.3_smt
          name: statement
          prose: The CIIO shall analyse all threats identified from threat hunting
            to determine if there is or has been any cybersecurity incident in respect
            of the CII, and shall trigger the applicable incident reporting, response
            and recovery plans if there is or has been a cybersecurity incident.
      - id: ccop-6.3.4
        class: ccop-provision
        title: CCoP 6.3.4
        props:
        - name: label
          value: 6.3.4
        - name: source-page
          value: '48'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-6.3.4_smt
          name: statement
          prose: The CIIO shall, if requested by the Commissioner, submit a copy of
            the completed threat hunting report, to the Commissioner no later than
            30 days upon receiving the request.
    - id: ccop-g-6.4
      class: ccop-subsection
      title: Cyber Threat Intelligence and Information Sharing
      props:
      - name: label
        value: '6.4'
      parts:
      - id: ccop-g-6.4_overview
        name: overview
        prose: Threat intelligence provides contextual information that enables organisations
          to take proactive actions to prevent or mitigate cybersecurity incidents.
          Threat intelligence involves obtaining an understanding of trending threat
          landscapes, cyber threat actors and their Tactics, Techniques and Procedures
          (TTPs), and to translate them into actionable contextualised information
          for early warning and detection. By doing so, organisations will be able
          to put in place appropriate controls to mitigate cybersecurity threats and
          vulnerabilities in a timely manner. Organisation should leverage on collective
          threat intelligence efforts through sharing and exchanging information on
          cybersecurity threats and vulnerabilities within the sector and with the
          Commissioner. This mutual sharing amongst stakeholders develops herd alertness,
          saves time, reduces duplicate efforts, and allows an organisation’s identification
          of threats to become another’s prevention.
      controls:
      - id: ccop-6.4.1
        class: ccop-provision
        title: CCoP 6.4.1
        props:
        - name: label
          value: 6.4.1
        - name: source-page
          value: '48'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-6.4.1_smt
          name: statement
          prose: The CIIO shall establish and implement mechanisms and processes to
            obtain threat intelligence, and to process and analyse the threat intelligence
            for relevance and potential impact to the CII. Threat intelligence includes
            information on the current cybersecurity threat landscape; activities
            of threat actors; tactics, techniques and procedures of threat actors;
            and cybersecurity vulnerabilities.
      - id: ccop-6.4.2
        class: ccop-provision
        title: CCoP 6.4.2
        props:
        - name: label
          value: 6.4.2
        - name: source-page
          value: '49'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-6.4.2_smt
          name: statement
          prose: The CIIO shall establish and implement mechanisms and processes to
            share information on cybersecurity threats and vulnerabilities, and on
            measures that can be taken in response to such threats and vulnerabilities,
            with the Commissioner for threat monitoring and analysis.
      - id: ccop-6.4.3
        class: ccop-provision
        title: CCoP 6.4.3
        props:
        - name: label
          value: 6.4.3
        - name: source-page
          value: '49'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-6.4.3_smt
          name: statement
          prose: The CIIO shall put in place controls to mitigate cybersecurity threats
            and address vulnerabilities identified from threat intelligence.
  - id: ccop-g-7
    class: ccop-section
    title: RESPONSE AND RECOVERY REQUIREMENTS
    props:
    - name: label
      value: '7'
    parts:
    - id: ccop-g-7_overview
      name: overview
      prose: Establishing, managing, and exercising cybersecurity incident response
        plans and crisis communication plans to prepare the CII for cybersecurity
        incidents.
    groups:
    - id: ccop-g-7.1
      class: ccop-subsection
      title: Incident Management
      props:
      - name: label
        value: '7.1'
      parts:
      - id: ccop-g-7.1_overview
        name: overview
        prose: Incident management seeks to minimise the impact of cybersecurity incidents
          through processes that include the identification, containment and eradication
          of cybersecurity threats, and the recovery of systems, root-cause analysis
          and implementation of corrective actions to prevent recurrence. It is important
          to have a plan with a clear Cybersecurity Incident Response Team structure
          that details everyone’s roles and responsibilities so that there can be
          clear lines of accountability and efficient communication channels. Incident
          response thresholds that are relevant to the business should also be determined
          so that the incident response plan can be triggered accurately without delays.
          Communication plans would also allow relevant parties to be updated with
          accurate situational updates. When conducting root cause analysis, organisations
          should also include structural, behavioural, managerial, technical or systemic
          factors that could contribute to the cybersecurity incident to address potential
          underlying issues and prevent a recurrence of similar incidents.
      controls:
      - id: ccop-7.1.1
        class: ccop-provision
        title: CCoP 7.1.1
        props:
        - name: label
          value: 7.1.1
        - name: source-page
          value: '50'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.1.1_smt
          name: statement
          prose: 'The CIIO shall establish a Cybersecurity Incident Response Plan
            that sets out how a CIIO should respond to a cybersecurity incident. The
            CIIO shall ensure that the Plan establishes: (a) A Cybersecurity Incident
            Response Team (“CIRT”) structure, including clearly defined roles and
            responsibilities of each team member and their contact details; (b) An
            incident reporting structure which sets out how the CIIO will comply with
            its reporting obligations under the Act and any other laws and regulations
            that apply to the CII; (c) Communication and coordination structures to
            ensure the timely escalation of cybersecurity incidents to the CIRT and
            to the senior management of the CIIO; (d) Thresholds and procedures to
            activate the incident response and CIRT; (e) Engagement protocols with
            external parties for forensic or recovery services and law enforcement
            agencies, and their contact details; (f) A communication plan to communicate
            information relating to a cybersecurity incident to internal and external
            stakeholders; (g) Processes and procedures to contain a cybersecurity
            incident, investigate the cause and impact of the cybersecurity incident,
            and to restore the CII’s operations; (h) Processes and procedures to collect
            and preserve digital forensic evidence before initiating the recovery
            process, to support investigations; and (i) A post-incident root cause
            analysis review process to identify and implement corrective measures
            to prevent a recurrence.'
      - id: ccop-7.1.2
        class: ccop-provision
        title: CCoP 7.1.2
        props:
        - name: label
          value: 7.1.2
        - name: source-page
          value: '51'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.1.2_smt
          name: statement
          prose: The CIIO shall ensure that the CIRT is trained and equipped with
            the resources to respond to cybersecurity incidents.
      - id: ccop-7.1.3
        class: ccop-provision
        title: CCoP 7.1.3
        props:
        - name: label
          value: 7.1.3
        - name: source-page
          value: '51'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.1.3_smt
          name: statement
          prose: The CIIO shall establish procedures to reset the Kerberos Ticket
            Granting Ticket account for CII assets that use the Kerberos authentication
            protocol for the domain controller, and shall reset the Kerberos Ticket
            Granting Ticket account in the event that the CII domain controller is
            compromised.
      - id: ccop-7.1.4
        class: ccop-provision
        title: CCoP 7.1.4
        props:
        - name: label
          value: 7.1.4
        - name: source-page
          value: '51'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.1.4_smt
          name: statement
          prose: 'The CIIO shall establish and implement processes to identify, investigate
            and address the root causes that contributed to each cybersecurity incident,
            including any structural, behavioural, managerial, technical or systemic
            factors, so as to prevent recurrence of similar incidents. This shall
            include processes to identify, investigate and address: (a) Gaps in the
            existing cybersecurity governance structure that may have led to ineffective
            cybersecurity risk management and oversight efforts; (b) Gaps in and failure
            to comply with policies, standards and procedures which may have contributed
            to the cybersecurity incident; and (c) Gaps in the audit process and the
            remediation of audit findings which may have contributed to the cybersecurity
            incident.'
      - id: ccop-7.1.5
        class: ccop-provision
        title: CCoP 7.1.5
        props:
        - name: label
          value: 7.1.5
        - name: source-page
          value: '51'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.1.5_smt
          name: statement
          prose: The CIIO shall communicate the Cybersecurity Incident Response Plan
            to all persons who use, operate and manage the CII, including external
            parties, and update these persons whenever there is a change to the Cybersecurity
            Incident Response Plan.
      - id: ccop-7.1.6
        class: ccop-provision
        title: CCoP 7.1.6
        props:
        - name: label
          value: 7.1.6
        - name: source-page
          value: '51'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.1.6_smt
          name: statement
          prose: The CIIO shall review the Cybersecurity Incident Response Plan to
            ensure that it remains updated and relevant at least once every 12 months
            or as often as required. The first instance of this review to be completed
            no later than 12 months from the time the plan is established.
      - id: ccop-7.1.7
        class: ccop-provision
        title: CCoP 7.1.7
        props:
        - name: label
          value: 7.1.7
        - name: source-page
          value: '51'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.1.7_smt
          name: statement
          prose: The CIIO shall also review the Cybersecurity Incident Response Plan
            when there are material changes to the CII cyber operating environment
            or incident response requirements.
      - id: ccop-7.1.8
        class: ccop-provision
        title: CCoP 7.1.8
        props:
        - name: label
          value: 7.1.8
        - name: source-page
          value: '51'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.1.8_smt
          name: statement
          prose: The CIIO shall, if requested by the Commissioner, submit a copy of
            the Cybersecurity Incident Response Plan, to the Commissioner no later
            than 30 days upon receiving the request.
    - id: ccop-g-7.2
      class: ccop-subsection
      title: Crisis Communication Plan
      props:
      - name: label
        value: '7.2'
      parts:
      - id: ccop-g-7.2_overview
        name: overview
        prose: A crisis communication plan is an important part of an organisation’s
          emergency preparedness and responses. The plan should include vital information
          including the required processes, mechanisms and personnel to achieve the
          goal of ensuring that communications are coordinated and consistent to all
          stakeholders.
      controls:
      - id: ccop-7.2.1
        class: ccop-provision
        title: CCoP 7.2.1
        props:
        - name: label
          value: 7.2.1
        - name: source-page
          value: '52'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.2.1_smt
          name: statement
          prose: The CIIO shall establish a Crisis Communication Plan to respond to
            a crisis arising from a cybersecurity incident.
      - id: ccop-7.2.2
        class: ccop-provision
        title: CCoP 7.2.2
        props:
        - name: label
          value: 7.2.2
        - name: source-page
          value: '52'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.2.2_smt
          name: statement
          prose: 'The CIIO shall ensure that the Crisis Communication Plan: (a) Establishes
            a crisis communication team to be activated during a crisis; (b) Identifies
            probable cybersecurity incident scenarios and corresponding courses of
            action; (c) Identifies target audiences and stakeholders for each type
            of cybersecurity incident scenario, which may include employees, customers,
            and the general public; (d) Identifies spokespersons and technical experts
            who will represent the organisation when addressing the media; (e) Identifies
            primary and alternate modes of communication for dissemination of information
            to relevant target audiences and stakeholders; (f) Establishes communication
            and coordination structures between the crisis communication team, spokespersons,
            technical experts, and any other relevant persons to ensure coordinated
            and consistent responses during a crisis; and (g) Provides for crisis
            communication training to ensure that employees are able to perform their
            assigned roles.'
      - id: ccop-7.2.3
        class: ccop-provision
        title: CCoP 7.2.3
        props:
        - name: label
          value: 7.2.3
        - name: source-page
          value: '52'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.2.3_smt
          name: statement
          prose: The CIIO shall communicate the Crisis Communication Plan to all relevant
            persons, including the crisis communication team, the spokespersons and
            the technical experts, and update these persons whenever there is a change
            to the Crisis Communication Plan.
      - id: ccop-7.2.4
        class: ccop-provision
        title: CCoP 7.2.4
        props:
        - name: label
          value: 7.2.4
        - name: source-page
          value: '52'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.2.4_smt
          name: statement
          prose: The CIIO shall review the Crisis Communication Plan at least once
            every 12 months or as often as required, to ensure that the Crisis Communication
            Plan remains effective. The first instance of this review is to be completed
            no later than 12 months from the time the Crisis Communication Plan is
            established.
      - id: ccop-7.2.5
        class: ccop-provision
        title: CCoP 7.2.5
        props:
        - name: label
          value: 7.2.5
        - name: source-page
          value: '53'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.2.5_smt
          name: statement
          prose: The CIIO shall, if requested by the Commissioner, submit a copy of
            the Crisis Communication Plan, to the Commissioner no later than 30 days
            upon receiving the request.
    - id: ccop-g-7.3
      class: ccop-subsection
      title: Cybersecurity Exercise
      props:
      - name: label
        value: '7.3'
      parts:
      - id: ccop-g-7.3_overview
        name: overview
        prose: 'Conducting cybersecurity exercises allow organisations to assess and
          validate their planning and operational capabilities, and to surface any
          areas of improvement. Exercises shall be formed by the CIIO’s sectoral threat
          profile as determined by the Sector Lead agency so that the exercise scenarios
          are relevant and realistic. As part of a regular cybersecurity exercise
          regime, organisations should adopt a structured planning cycle that includes:
          (1) assessing the business context and determining the exercise purpose
          to address key needs and priorities, (2) planning for the exercise and outlining
          the objectives and scope, (3) developing the exercise scenarios and content,
          (4) conducting the exercise, and (5) documenting key discussion points and
          areas for improvement. The continuous cycle of assessment, validation and
          improvement through a regular cybersecurity exercise regime that covers
          People, Process and Technology, improves the operational cyber readiness
          of the organisation, enabling swifter and more effective response to cybersecurity
          incidents.'
      controls:
      - id: ccop-7.3.1
        class: ccop-provision
        title: CCoP 7.3.1
        props:
        - name: label
          value: 7.3.1
        - name: source-page
          value: '53'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.3.1_smt
          name: statement
          prose: 'The CIIO shall develop a cybersecurity exercise plan that outlines
            the purpose, objectives, desired outcomes, scope, scenario, participant
            roles, logistics, and evaluation process for an exercise, ensuring everyone
            understands how it will be conducted. The exercise plan shall include:
            (a) the Master Scenario Events List, which is a chronological schedule
            of scenario events and injects that guides exercise play, drives participant
            actions, and ensures the exercise objectives are met; and (b) the entire
            planning and exercise schedule, communication arrangements, ground rules,
            post-exercise review activities to capture lessons learned, drive improvements.'
      - id: ccop-7.3.2
        class: ccop-provision
        title: CCoP 7.3.2
        props:
        - name: label
          value: 7.3.2
        - name: source-page
          value: '53'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.3.2_smt
          name: statement
          prose: The CIIO shall, if requested by the Commissioner, submit a copy of
            the exercise plan for review, to the Commissioner no later than 30 days
            upon receiving the request.
      - id: ccop-7.3.3
        class: ccop-provision
        title: CCoP 7.3.3
        props:
        - name: label
          value: 7.3.3
        - name: source-page
          value: '53'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.3.3_smt
          name: statement
          prose: 'The CIIO shall conduct scenario-based cybersecurity exercises to
            test and validate the effectiveness of the following plans based on the
            exercise purpose and objectives: (a) Crisis Management Plan for decision-making
            (led by the CEO or a member from the Senior Management team); (b) Cybersecurity
            Incident Response Plan (led by the CISO or a suitably qualified personnel);
            (c) Sectoral Heightened Alert Plan (led by the CISO or a suitably qualified
            personnel); (d) Business Continuity Plan (led by the CIO or a suitably
            qualified personnel); (e) Disaster Recovery Plan (led by the CIO or a
            suitably qualified personnel); (f) Internal and External Stakeholders
            Communication Plan (led by the Head of Communications or a suitably qualified
            personnel); and (g) Improvement Plan(s) from previous exercise reviews
            (led by the CISO or a suitably qualified personnel).'
      - id: ccop-7.3.4
        class: ccop-provision
        title: CCoP 7.3.4
        props:
        - name: label
          value: 7.3.4
        - name: source-page
          value: '54'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.3.4_smt
          name: statement
          prose: The CIIO shall conduct the scenario-based cybersecurity exercises
            referred in clause 7.3.3 at least once every 12 months. The first instance
            of such exercises is to be completed no later than 12 months after the
            Compliance Date.
      - id: ccop-7.3.5
        class: ccop-provision
        title: CCoP 7.3.5
        props:
        - name: label
          value: 7.3.5
        - name: source-page
          value: '54'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.3.5_smt
          name: statement
          prose: 'The CIIO shall develop exercise scenarios based on threat modelling
            methodologies (e.g., STRIDE) to identify possible attack pathways and
            assess their potential impact on the CII and or interconnected systems.
            These scenarios shall be designed to test and validate: (a) the effectiveness
            and timeliness of responses to threats and vulnerabilities identified
            through threat intelligence and risk assessments; (b) incident coordination,
            communication, decision-making, and escalation with plans with CSA, relevant
            stakeholders, and external parties; (c) the ability to maintain continuous
            monitoring, detection, and situational awareness for additional cybersecurity
            threats and incidents throughout the incident response process; and (d)
            the adequacy of the CIIO’s personnel, processes, technologies, resources
            and capabilities to respond to, manage, and recover from cybersecurity
            incidents.'
      - id: ccop-7.3.6
        class: ccop-provision
        title: CCoP 7.3.6
        props:
        - name: label
          value: 7.3.6
        - name: source-page
          value: '54'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.3.6_smt
          name: statement
          prose: The exercise scenarios shall include (i) CII systems, and (ii) interconnected
            systems, based on the exercise objectives and scope to ensure holistic
            evaluation of cybersecurity readiness.
      - id: ccop-7.3.7
        class: ccop-provision
        title: CCoP 7.3.7
        props:
        - name: label
          value: 7.3.7
        - name: source-page
          value: '54'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.3.7_smt
          name: statement
          prose: 'Based on the exercise objectives and scope, the CIIO shall ensure
            that the relevant stakeholders from the following list of categories participate
            in the cybersecurity exercises: (a) Crisis management team (where the
            senior management team is involved per 7.3.3); (b) CIRT; (c) Business
            operation staff; (d) Crisis communication team; and (e) External Parties'
      - id: ccop-7.3.8
        class: ccop-provision
        title: CCoP 7.3.8
        props:
        - name: label
          value: 7.3.8
        - name: source-page
          value: '55'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.3.8_smt
          name: statement
          prose: The CIIO shall, if requested by the Commissioner, submit a copy of
            the completed cybersecurity exercise report, along with the CIIO’s post-exercise
            improvement plans, to the Commissioner no later than 30 days of receiving
            the request.
      - id: ccop-7.3.9
        class: ccop-provision
        title: CCoP 7.3.9
        props:
        - name: label
          value: 7.3.9
        - name: source-page
          value: '55'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.3.9_smt
          name: statement
          prose: In relation to cybersecurity exercises conducted by the Commissioner
            under section 16 of the Act, the CIIO shall comply with any request by
            the Commissioner to provide information relating to the CII or interconnected
            systems, including the plans listed in clause 7.3.3, for the purpose of
            planning and conducting such exercises.
      - id: ccop-7.3.10
        class: ccop-provision
        title: CCoP 7.3.10
        props:
        - name: label
          value: 7.3.10
        - name: source-page
          value: '55'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-7.3.10_smt
          name: statement
          prose: The CIIOs shall assign personnel responsible for the cybersecurity
            of the CII, to participate in technical cybersecurity exercises organised
            by CSA or its designated partners at least once every 12 months.
  - id: ccop-g-8
    class: ccop-section
    title: CYBER RESILIENCY REQUIREMENTS
    props:
    - name: label
      value: '8'
    parts:
    - id: ccop-g-8_overview
      name: overview
      prose: Cyber resilience includes maintaining the ability of the CIIO and CII
        to withstand cybersecurity incidents, continue the delivery of essential services
        and recover from cybersecurity incidents.
    groups:
    - id: ccop-g-8.1
      class: ccop-subsection
      title: Backup and Restoration Plan
      props:
      - name: label
        value: '8.1'
      parts:
      - id: ccop-g-8.1_overview
        name: overview
        prose: Having a sound restoration plan is critical to protect organisations
          against data loss or data corruption. Backup copies of data, software and
          systems allow data to be restored from an earlier copy in the event of system
          disruption or data corruption. Hence, organisations should conduct regular
          reviews to ensure that the backup copies are reliable. In addition, these
          backup copies need to be protected from the loss of confidentiality and
          unauthorised tampering of the data.
      controls:
      - id: ccop-8.1.1
        class: ccop-provision
        title: CCoP 8.1.1
        props:
        - name: label
          value: 8.1.1
        - name: source-page
          value: '56'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-8.1.1_smt
          name: statement
          prose: The CIIO shall establish a backup and restoration plan to ensure
            that its CII assets can be recovered in the event of system disruption
            or data corruption.
      - id: ccop-8.1.2
        class: ccop-provision
        title: CCoP 8.1.2
        props:
        - name: label
          value: 8.1.2
        - name: source-page
          value: '56'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-8.1.2_smt
          name: statement
          prose: The CIIO shall perform periodic backups at a frequency that is commensurate
            with the CIIO’s operational requirements and ensure that the backups are
            completed successfully.
      - id: ccop-8.1.3
        class: ccop-provision
        title: CCoP 8.1.3
        props:
        - name: label
          value: 8.1.3
        - name: source-page
          value: '56'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-8.1.3_smt
          name: statement
          prose: The CIIO shall ensure that backups are stored on devices that are
            not connected to any computer or to the internet and are separate from
            the corresponding CII assets, and are protected from unauthorised access,
            modification and deletion.
      - id: ccop-8.1.4
        class: ccop-provision
        title: CCoP 8.1.4
        props:
        - name: label
          value: 8.1.4
        - name: source-page
          value: '56'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-8.1.4_smt
          name: statement
          prose: The CIIO shall test the restoration of the backups periodically to
            ensure that they can be restored when required. The frequency of the tests
            shall be commensurate with the cybersecurity risk profile of the CII.
      - id: ccop-8.1.5
        class: ccop-provision
        title: CCoP 8.1.5
        props:
        - name: label
          value: 8.1.5
        - name: source-page
          value: '56'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-8.1.5_smt
          name: statement
          prose: The CIIO shall review the backup and restoration plan at least once
            every 12 months to ensure that the plan remains relevant. The first instance
            of this review is to be completed no later than 12 months from the time
            the plan is established.
    - id: ccop-g-8.2
      class: ccop-subsection
      title: Business Continuity Plan and Disaster Recovery Plan
      props:
      - name: label
        value: '8.2'
      parts:
      - id: ccop-g-8.2_overview
        name: overview
        prose: It is critical for organisations to have effective business continuity
          and disaster recovery plans to enable them to recover from service disruption
          and to continue the delivery of products and services. The plans must include
          processes of creating recovery systems to deal with cyber threats and to
          ensure process continuity in the wake of a cyber-attack. To ensure effective
          business continuity and disaster recovery plans, it is important to include
          recovery time objective (RTO) and recovery point objective (RPO) when developing
          the plans. Both metrics help to design the recovery process, define the
          recovery limits, the frequency of backups and the recovery procedures. The
          CIIO needs to exercise the plans periodically to ensure that they are effective
          and relevant personnel are familiar with the plans.
      controls:
      - id: ccop-8.2.1
        class: ccop-provision
        title: CCoP 8.2.1
        props:
        - name: label
          value: 8.2.1
        - name: source-page
          value: '57'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-8.2.1_smt
          name: statement
          prose: The CIIO shall establish a Business Continuity Plan (“BCP”) and a
            Disaster Recovery Plan (“DRP”) to ensure continuous delivery of essential
            services, in the event of disruption due to a cybersecurity incident.
      - id: ccop-8.2.2
        class: ccop-provision
        title: CCoP 8.2.2
        props:
        - name: label
          value: 8.2.2
        - name: source-page
          value: '57'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-8.2.2_smt
          name: statement
          prose: The CIIO shall ensure that the BCP and DRP include plans for addressing
            different cybersecurity threat scenarios.
      - id: ccop-8.2.3
        class: ccop-provision
        title: CCoP 8.2.3
        props:
        - name: label
          value: 8.2.3
        - name: source-page
          value: '57'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-8.2.3_smt
          name: statement
          prose: The CIIO shall define the recovery time objective and recovery point
            objective in the BCP.
      - id: ccop-8.2.4
        class: ccop-provision
        title: CCoP 8.2.4
        props:
        - name: label
          value: 8.2.4
        - name: source-page
          value: '57'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-8.2.4_smt
          name: statement
          prose: For CII assets that use the Kerberos authentication protocol for
            the domain controller, the CIIO shall exercise the recovery procedures
            for the compromise of the Kerberos Ticket Granting Ticket as part of the
            disaster recovery exercise.
      - id: ccop-8.2.5
        class: ccop-provision
        title: CCoP 8.2.5
        props:
        - name: label
          value: 8.2.5
        - name: source-page
          value: '57'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-8.2.5_smt
          name: statement
          prose: The CIIO shall review the BCP and DRP plans at least once every 12
            months to ensure their continued effectiveness. The first instance of
            this review is to be completed no later than 12 months from the time the
            respective plan is established.
  - id: ccop-g-9
    class: ccop-section
    title: CYBERSECURITY TRAINING & AWARENESS
    props:
    - name: label
      value: '9'
    parts:
    - id: ccop-g-9_overview
      name: overview
      prose: Effective security awareness training helps employees understand proper
        cyber hygiene, the security risks associated with their actions and to identify
        cybersecurity incidents that they may encounter in their work. Being aware
        of the evolving cybersecurity threats and being equipped with the essential
        cybersecurity skillsets enable the CIIO to recognise cybersecurity threats
        and mitigate them in a timely manner.
    groups:
    - id: ccop-g-9.1
      class: ccop-subsection
      title: Cybersecurity Awareness Programme
      props:
      - name: label
        value: '9.1'
      parts:
      - id: ccop-g-9.1_overview
        name: overview
        prose: Cybersecurity attacks, such as phishing, are increasingly common, and
          these attacks often spearheads an attacker’s initial entry into an organisation.
          Hence, an effective cybersecurity awareness programme to ensure that employees
          are aware of and fulfil their cybersecurity responsibilities is paramount.
          A good cybersecurity awareness programme enhances the cybersecurity vigilance
          and inculcates the responsible usage of technology of the employees and
          contractors. This mitigates the cybersecurity risks arising from the human
          factor.
      controls:
      - id: ccop-9.1.1
        class: ccop-provision
        title: CCoP 9.1.1
        props:
        - name: label
          value: 9.1.1
        - name: source-page
          value: '58'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-9.1.1_smt
          name: statement
          prose: 'The CIIO shall establish and implement a cybersecurity awareness
            programme to educate and develop cybersecurity awareness for all persons
            who use, operate and manage the CII, including external parties, including
            to: (a) Promote awareness of relevant laws, regulations, codes of practice,
            policies, standards, guidelines and procedures; (b) Provide regular and
            timely communication covering general cybersecurity awareness messages
            and prevailing cybersecurity threats, impacts and mitigations; and (c)
            Positively shape individual behaviour and the security culture of the
            organisation.'
      - id: ccop-9.1.2
        class: ccop-provision
        title: CCoP 9.1.2
        props:
        - name: label
          value: 9.1.2
        - name: source-page
          value: '58'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-9.1.2_smt
          name: statement
          prose: The CIIO shall measure the effectiveness of the cybersecurity awareness
            programme in achieving the purposes stated in clause 9.1.1 through means
            such as quizzes and surveys at least once every 12 months. The first instance
            of such measuring is to be completed no later than 12 months after the
            programme is implemented.
      - id: ccop-9.1.3
        class: ccop-provision
        title: CCoP 9.1.3
        props:
        - name: label
          value: 9.1.3
        - name: source-page
          value: '58'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-9.1.3_smt
          name: statement
          prose: The CIIO shall review the cybersecurity awareness programme at least
            once every 12 months to ensure that the programme remains current and
            relevant. The first instance of this review is to be completed no later
            than 12 months from the time the programme is established.
    - id: ccop-g-9.2
      class: ccop-subsection
      title: Cybersecurity Training and Skills
      props:
      - name: label
        value: '9.2'
      parts:
      - id: ccop-g-9.2_overview
        name: overview
        prose: It is important for CIIOs to ensure that the personnel who operate
          or manage the CII or are involved in ensuring the cybersecurity of the CII
          have the necessary cybersecurity competencies to perform their roles and
          responsibilities effectively.
      controls:
      - id: ccop-9.2.1
        class: ccop-provision
        title: CCoP 9.2.1
        props:
        - name: label
          value: 9.2.1
        - name: source-page
          value: '59'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-9.2.1_smt
          name: statement
          prose: The CIIO shall ensure that all employees that operate and manage
            the CII attain the cybersecurity competencies necessary to perform their
            roles effectively.
      - id: ccop-9.2.2
        class: ccop-provision
        title: CCoP 9.2.2
        props:
        - name: label
          value: 9.2.2
        - name: source-page
          value: '59'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-9.2.2_smt
          name: statement
          prose: The CIIO shall maintain records of training attended by employees,
            including external parties, who operate and manage the CII.
      - id: ccop-9.2.3
        class: ccop-provision
        title: CCoP 9.2.3
        props:
        - name: label
          value: 9.2.3
        - name: source-page
          value: '59'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-9.2.3_smt
          name: statement
          prose: The CIIO shall ensure that external parties that operate and manage
            the CII have the necessary cybersecurity competencies to perform their
            roles effectively.
      - id: ccop-9.2.4
        class: ccop-provision
        title: CCoP 9.2.4
        props:
        - name: label
          value: 9.2.4
        - name: source-page
          value: '59'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-9.2.4_smt
          name: statement
          prose: The CIIO shall ensure that any person or group of persons tasked
            with conducting a cybersecurity risk assessment for a CII is supervised
            by an individual possessing industry-recognised certification, such as
            Certified in Risk and Information Systems Control (CRISC). Where the industry
            recognised certification cannot be obtained, the CIIO shall explain how
            the cybersecurity risk assessment will be adequately supervised.
      - id: ccop-9.2.5
        class: ccop-provision
        title: CCoP 9.2.5
        props:
        - name: label
          value: 9.2.5
        - name: source-page
          value: '59'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-9.2.5_smt
          name: statement
          prose: The CIIO shall ensure that any person or group of persons tasked
            with conducting a cybersecurity audit for a CII is supervised by an individual
            possessing industry-recognised certification, such as Certified Information
            Systems Auditor (CISA). Where the industry recognised certification cannot
            be obtained, the CIIO shall explain the reasons how the cybersecurity
            audit will be adequately supervised.
  - id: ccop-g-10
    class: ccop-section
    title: OPERATIONAL TECHNOLOGY (OT) SECURITY REQUIREMENTS
    props:
    - name: label
      value: '10'
    groups:
    - id: ccop-g-10.1
      class: ccop-subsection
      title: Application of this Section
      props:
      - name: label
        value: '10.1'
      controls:
      - id: ccop-10.1.1
        class: ccop-provision
        title: CCoP 10.1.1
        props:
        - name: label
          value: 10.1.1
        - name: source-page
          value: '60'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.1.1_smt
          name: statement
          prose: This section shall apply to CII which are OT systems (“OT CII”).
      - id: ccop-10.1.2
        class: ccop-provision
        title: CCoP 10.1.2
        props:
        - name: label
          value: 10.1.2
        - name: source-page
          value: '60'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.1.2_smt
          name: statement
          prose: In this section, the following terms shall have the corresponding
            meaning “alert suppression” The act of dismissing a notification. “fail-safe”
            A feature or practice that is designed to handle failure that results
            in minimal or no harm to equipment, environment and people. “field controller”
            Industrial computer (e.g., Programmable Logic Controller (PLC), Remote
            Terminal Unit (RTU)) in an OT environment used to monitor and/or control
            physical processes. “interlock” Mechanism, process or function to prevent
            operation (e.g., start-up, stoppage, etc) from entering in an undesired
            state. “physical process” An action or activity denoted by any change
            of operation states, such as valve movement (open to close status), circuit
            breaker activated (close to open status) and motor rotation (low to high
            speed). “programme code” The programmable code (e.g., Supervisory Control
            and Data Acquisition (SCADA) / Distributed Control System (DCS) function
            script, ladder diagram, function block diagram, structured text) developed
            for an application that is used to monitor and control the CII. “register
            block” A temporary memory space that is used by the field controller to
            store or manipulate data. “Safety Instrumented Control systems that take
            a physical process to a safe state System” when in conditions that are
            or may become hazardous.
    - id: ccop-g-10.2
      class: ccop-subsection
      title: OT Architecture and Security
      props:
      - name: label
        value: '10.2'
      parts:
      - id: ccop-g-10.2_overview
        name: overview
        prose: With increased connectivity between IT and OT systems, cyber threat
          actors are now able to compromise IT enterprise systems connected to the
          Internet, secure their footholds, and pivot into the OT systems to disrupt
          industrial processes. Hence, OT CII should not be connected to any enterprise
          network except where necessary for operating the CII. In addition, control
          mechanisms implemented in the OT systems and networks should not be shared
          across different operating environments. By having separate networks and
          control mechanisms in these networks, the risk of lateral movement between
          the networks is minimised. There are several layers of control systems in
          an OT environment. Examples such as Distributed Control System (DCS) and
          Supervisory Control and Data Acquisition (SCADA) control the field controllers
          (e.g. PLC) that connect to the critical operational processes. The design
          of such control systems is often driven by the need to ensure reliability
          and safety; cyber security components are usually deprioritised. Hence,
          these control systems and OT devices tend to be more reliant on perimeter
          defences and network segregation to ensure that they are protected against
          cyber threat actors. However, it is important to ensure that these devices
          are secured to minimise the attack surface. It is also important to incorporate
          engineering design concepts such as fail-safe mechanisms to eliminate or
          reduce the consequences of the affected system with respect to cybersecurity
          risks.
      controls:
      - id: ccop-10.2.1
        class: ccop-provision
        title: CCoP 10.2.1
        props:
        - name: label
          value: 10.2.1
        - name: source-page
          value: '61'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.2.1_smt
          name: statement
          prose: The CIIO shall ensure that the OT CII is not connected to any enterprise
            network except where necessary for operating the CII and provided that
            the direction of data flows is restricted to only one-way from the OT
            CII to the enterprise network.
      - id: ccop-10.2.2
        class: ccop-provision
        title: CCoP 10.2.2
        props:
        - name: label
          value: 10.2.2
        - name: source-page
          value: '61'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.2.2_smt
          name: statement
          prose: The CIIO shall monitor the data flows from the OT CII to any enterprise
            network for anomalies and trigger an alert for investigation when any
            anomaly is detected.
      - id: ccop-10.2.3
        class: ccop-provision
        title: CCoP 10.2.3
        props:
        - name: label
          value: 10.2.3
        - name: source-page
          value: '61'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.2.3_smt
          name: statement
          prose: The CIIO shall implement separate authentication mechanisms and account
            credentials for users of the OT CII network and any enterprise network.
            This is to prevent threat actors from using compromised credentials across
            different operating environments.
      - id: ccop-10.2.4
        class: ccop-provision
        title: CCoP 10.2.4
        props:
        - name: label
          value: 10.2.4
        - name: source-page
          value: '61'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.2.4_smt
          name: statement
          prose: The CIIO shall ensure that the OT CII has fail-safes to ensure the
            safety and reliability of operations in the event of a cybersecurity incident.
      - id: ccop-10.2.5
        class: ccop-provision
        title: CCoP 10.2.5
        props:
        - name: label
          value: 10.2.5
        - name: source-page
          value: '62'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.2.5_smt
          name: statement
          prose: 'The CIIO shall identify physical processes controlled by the OT
            CII and shall, to the extent possible, perform the following for each
            process: (a) Establish a baseline tolerance level for the operation time
            taken by the physical processes; (b) Monitor the duration of physical
            processes for deviations from the baseline tolerance level; and (c) Ensure
            the field controller controlling the physical processes operate in a fail-safe
            state when deviations outside of the tolerance level occur and trigger
            an alert for investigation.'
      - id: ccop-10.2.6
        class: ccop-provision
        title: CCoP 10.2.6
        props:
        - name: label
          value: 10.2.6
        - name: source-page
          value: '62'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.2.6_smt
          name: statement
          prose: The CIIO shall ensure that the Safety Instrumented System (SIS) is
            only connected to authorised field devices . This is to protect the SIS
            and its functions from being compromised in the event of a cybersecurity
            incident affecting other computers or computer systems.
      - id: ccop-10.2.7
        class: ccop-provision
        title: CCoP 10.2.7
        props:
        - name: label
          value: 10.2.7
        - name: source-page
          value: '62'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.2.7_smt
          name: statement
          prose: The CIIO shall periodically assess whether it is possible to replace
            CII assets (including legacy assets) with more secure versions, and make
            such replacements where possible to improve the cybersecurity of the CII.
    - id: ccop-g-10.3
      class: ccop-subsection
      title: Secure Coding
      props:
      - name: label
        value: '10.3'
      parts:
      - id: ccop-g-10.3_overview
        name: overview
        prose: Codes determine how digital devices behave and could be compromised
          to perform unintended actions that impact the operations of the system.
          It is thus important to implement security mechanisms and processes to secure
          the codes.
      controls:
      - id: ccop-10.3.1
        class: ccop-provision
        title: CCoP 10.3.1
        props:
        - name: label
          value: 10.3.1
        - name: source-page
          value: '62'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.3.1_smt
          name: statement
          prose: The CIIO shall verify the integrity of all embedded firmware of OT
            CII assets before they are used in the CII, and shall periodically verify
            the integrity of all embedded firmware in the OT CII.
      - id: ccop-10.3.2
        class: ccop-provision
        title: CCoP 10.3.2
        props:
        - name: label
          value: 10.3.2
        - name: source-page
          value: '62'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.3.2_smt
          name: statement
          prose: The CIIO shall verify the integrity of the programme codes in a field
            controller before use, and shall periodically verify the integrity of
            all programme codes in field controllers.
      - id: ccop-10.3.3
        class: ccop-provision
        title: CCoP 10.3.3
        props:
        - name: label
          value: 10.3.3
        - name: source-page
          value: '62'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.3.3_smt
          name: statement
          prose: With regard to field controllers that are intended to have a fail-safe
            state, the CIIO shall identify and include interlocks in the field controllers’
            programme codes.
      - id: ccop-10.3.4
        class: ccop-provision
        title: CCoP 10.3.4
        props:
        - name: label
          value: 10.3.4
        - name: source-page
          value: '62'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.3.4_smt
          name: statement
          prose: The CIIO shall establish mechanisms to validate the input values
            to the field controller to ensure that they are within a valid operational
            range.
      - id: ccop-10.3.5
        class: ccop-provision
        title: CCoP 10.3.5
        props:
        - name: label
          value: 10.3.5
        - name: source-page
          value: '62'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.3.5_smt
          name: statement
          prose: The CIIO shall ensure that no unauthorised changes are made to the
            programme code or input values of a field controller.
      - id: ccop-10.3.6
        class: ccop-provision
        title: CCoP 10.3.6
        props:
        - name: label
          value: 10.3.6
        - name: source-page
          value: '63'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.3.6_smt
          name: statement
          prose: The CIIO shall assign a separate and designated register block each
            for reading, writing, validating writes, calculation, and any other relevant
            function of the field controller, in order to facilitate data verification,
            prevent buffer overflows, prevent unauthorised writes and protect controller
            data.
      - id: ccop-10.3.7
        class: ccop-provision
        title: CCoP 10.3.7
        props:
        - name: label
          value: 10.3.7
        - name: source-page
          value: '63'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.3.7_smt
          name: statement
          prose: The CIIO shall identify programme codes in a field controller that
            function independently of other programme codes within the field controller,
            and modularise such programme codes to facilitate the detection of malicious
            codes.
    - id: ccop-g-10.4
      class: ccop-subsection
      title: Field Controllers
      props:
      - name: label
        value: '10.4'
      parts:
      - id: ccop-g-10.4_overview
        name: overview
        prose: Field controllers are usually insecure by design and are potentially
          vulnerable to communication interception and modification. In addition,
          the processing unit within the field controller is susceptible to modification
          thus affecting the control functions. Therefore, it is necessary to verify
          that both the field controller itself and the communication to and from
          the field controller are secured to achieve integrity of the communication.
      controls:
      - id: ccop-10.4.1
        class: ccop-provision
        title: CCoP 10.4.1
        props:
        - name: label
          value: 10.4.1
        - name: source-page
          value: '63'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.4.1_smt
          name: statement
          prose: 'The CIIO shall establish mechanisms and processes to reduce and
            manage cybersecurity risks relating to connections between a field controller
            and any network or device, including: (a) Establishing a separate communication
            module when connecting the field controller to an external network or
            device, to prevent unauthorised access to the OT CII through the field
            controller; (b) Implementing authentication processes for data transmission
            between the field controller and any network or device; (c) Preventing
            unauthorised data transmission, including unauthorised write functions,
            to ensure the safety and reliability of the operations; (d) Preventing
            data transmission between the field controller and the network or device
            when the field controller is in a fault or error state, except where doing
            so would adversely affect the safety and reliability of operations; and
            (e) Enabling security features such as password-protection.'
      - id: ccop-10.4.2
        class: ccop-provision
        title: CCoP 10.4.2
        props:
        - name: label
          value: 10.4.2
        - name: source-page
          value: '63'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.4.2_smt
          name: statement
          prose: The CIIO shall ensure that all alerts, errors and warnings from the
            field controllers are investigated in a timely manner.
      - id: ccop-10.4.3
        class: ccop-provision
        title: CCoP 10.4.3
        props:
        - name: label
          value: 10.4.3
        - name: source-page
          value: '63'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.4.3_smt
          name: statement
          prose: The CIIO shall establish mechanisms to monitor for alert suppression
            in the field controllers and trigger an alert for investigation when any
            unauthorised alert suppression is detected.
      - id: ccop-10.4.4
        class: ccop-provision
        title: CCoP 10.4.4
        props:
        - name: label
          value: 10.4.4
        - name: source-page
          value: '63'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.4.4_smt
          name: statement
          prose: The CIIO shall establish baselines for normal day-to-day operational
            activities of field controllers, including baselines for cycle time, operational
            uptime, stop state, and memory usage, against which the CIIO is to monitor
            for deviations and anomalous activities, and trigger an alert for investigation
            when any deviation or anomaly is detected.
      - id: ccop-10.4.5
        class: ccop-provision
        title: CCoP 10.4.5
        props:
        - name: label
          value: 10.4.5
        - name: source-page
          value: '64'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-10.4.5_smt
          name: statement
          prose: The CIIO shall review the baselines referred to in clause 10.4.4
            at least once every 12 months. The first instance of this review is to
            be completed no later than 12 months from the time the baseline is established.
  - id: ccop-g-11
    class: ccop-section
    title: DOMAIN-SPECIFIC PRACTICES
    props:
    - name: label
      value: '11'
    groups:
    - id: ccop-g-11.1
      class: ccop-subsection
      title: Application of this Section
      props:
      - name: label
        value: '11.1'
      parts:
      - id: ccop-g-11.1_overview
        name: overview
        prose: This section applies only to CII which CII assets include internet-facing
          Domain Name System (DNS) servers.
    - id: ccop-g-11.2
      class: ccop-subsection
      title: Domain Name System Security Extension (DNSSEC)
      props:
      - name: label
        value: '11.2'
      parts:
      - id: ccop-g-11.2_overview
        name: overview
        prose: DNS is the phone book of the Internet. It enables access to internet
          websites and services through the use of user-friendly domain names rather
          than IP address. It translates domain names to IP address and back, telling
          computers where to send and retrieve information. Unfortunately, it also
          accepts any address given to it, without verification and validation. This
          makes it vulnerable to cyber-attacks like spoofing, and DNS cache poisoning,
          that focus on corrupting or altering the DNS records and placing false information
          in a DNS resolver cache. To address such attacks, DNSSEC should be enabled.
          DNSSEC is a security feature of DNS which validates DNS information (e.g.
          IP address) for a given domain name (e.g. csa.gov.sg), by adding cryptographic
          signatures to existing DNS records. This allows for the validation of the
          authenticity and message content integrity of DNS records.
      controls:
      - id: ccop-11.2.1
        class: ccop-provision
        title: CCoP 11.2.1
        props:
        - name: label
          value: 11.2.1
        - name: source-page
          value: '65'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-11.2.1_smt
          name: statement
          prose: The CIIO shall enable DNSSEC validation for its DNS resolvers, or
            implement any equivalent or better methods of validating the integrity
            of DNS records, to prevent DNS attacks such as DNS cache poisoning and
            DNS spoofing.
      - id: ccop-11.2.2
        class: ccop-provision
        title: CCoP 11.2.2
        props:
        - name: label
          value: 11.2.2
        - name: source-page
          value: '65'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-11.2.2_smt
          name: statement
          prose: The CIIO shall ensure that all domain names under its control and
            used in connection with the CII, including in the operation of the CII
            and in the delivery of services, are DNSSEC-signed on the corresponding
            DNS Authoritative Server for each domain name.
  - id: ccop-g-12
    class: ccop-section
    title: SECURING CII INTERCONNECTED SYSTEMS (OWNED, OPERATED, AND/OR CONTROLLED
      BY THE CIIO)
    props:
    - name: label
      value: '12'
    parts:
    - id: ccop-g-12_overview
      name: overview
      prose: CIIOs shall move beyond foundational requirements to safeguard CII assets
        by implementing robust measures to proactively secure systems that communicates
        with or connect to the CII that is controlled by the CIIO against cyber threats,
        protecting these interconnected systems from being exploited as attack vectors
        into the CII environment.
    groups:
    - id: ccop-g-12.1
      class: ccop-subsection
      title: Asset Management
      props:
      - name: label
        value: '12.1'
      controls:
      - id: ccop-12.1.1
        class: ccop-provision
        title: CCoP 12.1.1
        props:
        - name: label
          value: 12.1.1
        - name: source-page
          value: '66'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.1.1_smt
          name: statement
          prose: 'With respect to the CIIO’s obligations under clause 4.1.1, the CIIO
            shall establish mechanisms and processes to identify interconnected systems
            that are owned, managed or controlled by the CIIO regardless of proximity
            to the CII as long as there is a communication path to the CII. The inventory
            shall include the following: (a) Owner and/or operator of each interconnected
            system asset; (b) Name and description of each interconnected system asset;
            (c) Description of critical functions of each interconnected system asset;
            (d) Key person(s) responsible for the cybersecurity of each interconnected
            system asset; (e) The dependencies of each interconnected system asset
            and the connections between each interconnected system asset and any systems
            or networks (whether internal or external to the interconnected system);
            (f) Physical location of each interconnected system asset; (g) Outsourced
            service providers used to support each interconnected system asset; (h)
            Cloud services used to support each interconnected system asset; and (i)
            Description of the internet links supporting the interconnected system,
            including information on the distributed denial-of-service (DDoS) attack
            mitigation measures in place for these internet links.'
      - id: ccop-12.1.2
        class: ccop-provision
        title: CCoP 12.1.2
        props:
        - name: label
          value: 12.1.2
        - name: source-page
          value: '66'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.1.2_smt
          name: statement
          prose: The CIIO shall maintain an accurate CII network topology diagram
            with the interconnected systems identified and the interfaces and connectivity
            between the network devices and segments.
    - id: ccop-g-12.2
      class: ccop-subsection
      title: Account Management
      props:
      - name: label
        value: '12.2'
      controls:
      - id: ccop-12.2.1
        class: ccop-provision
        title: CCoP 12.2.1
        props:
        - name: label
          value: 12.2.1
        - name: source-page
          value: '67'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.2.1_smt
          name: statement
          prose: The CIIO shall grant to each account only the minimum privileges
            necessary for its assigned functions across the interconnected systems.
      - id: ccop-12.2.2
        class: ccop-provision
        title: CCoP 12.2.2
        props:
        - name: label
          value: 12.2.2
        - name: source-page
          value: '67'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.2.2_smt
          name: statement
          prose: The CIIO shall delete or disable any account that is no longer necessary
            or is inactive to prevent unauthorised access to the interconnected systems.
      - id: ccop-12.2.3
        class: ccop-provision
        title: CCoP 12.2.3
        props:
        - name: label
          value: 12.2.3
        - name: source-page
          value: '67'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.2.3_smt
          name: statement
          prose: The CIIO shall perform a review of all accounts (e.g. privileged,
            user and application accounts) that have access to the interconnected
            systems. The review is to evaluate the validity of accounts and to ensure
            that privileges assigned to each account are up-to-date and required to
            support operational purposes.
      - id: ccop-12.2.4
        class: ccop-provision
        title: CCoP 12.2.4
        props:
        - name: label
          value: 12.2.4
        - name: source-page
          value: '67'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.2.4_smt
          name: statement
          prose: The CIIO shall perform this review at least once every 12 months.
            The first instance of this review is to be completed no later than 12
            months after the Compliance Date.
    - id: ccop-g-12.3
      class: ccop-subsection
      title: Privileged Account Management
      props:
      - name: label
        value: '12.3'
      controls:
      - id: ccop-12.3.1
        class: ccop-provision
        title: CCoP 12.3.1
        props:
        - name: label
          value: 12.3.1
        - name: source-page
          value: '67'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.3.1_smt
          name: statement
          prose: The CIIO shall implement multi-factor authentication where privileged
            accounts are used to access interconnected systems and where access is
            to be escalated to the level of privileged access (e.g., where the user
            seeks to obtain additional permissions on a system or network after an
            initial log-in).
      - id: ccop-12.3.2
        class: ccop-provision
        title: CCoP 12.3.2
        props:
        - name: label
          value: 12.3.2
        - name: source-page
          value: '67'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.3.2_smt
          name: statement
          prose: The CIIO shall prohibit the sharing of privileged account(s) used
            by network and system administrators, and any other personnel with privileged
            access, across interconnected systems and establish processes to detect
            and remediate instances of account sharing.
      - id: ccop-12.3.3
        class: ccop-provision
        title: CCoP 12.3.3
        props:
        - name: label
          value: 12.3.3
        - name: source-page
          value: '67'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.3.3_smt
          name: statement
          prose: The CIIO shall restrict the use of “break glass” account(s) for administrative
            use during emergency where the normal administrative access is unavailable.
            Access to such account(s) shall be protected with access controls (e.g.
            “break glass” account password management process), logging and post-use
            review to ensure accountability.
    - id: ccop-g-12.4
      class: ccop-subsection
      title: Network Segmentation
      props:
      - name: label
        value: '12.4'
      controls:
      - id: ccop-12.4.1
        class: ccop-provision
        title: CCoP 12.4.1
        props:
        - name: label
          value: 12.4.1
        - name: source-page
          value: '67'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.4.1_smt
          name: statement
          prose: The CIIO shall segment the interconnected systems into different
            network segments based on their different security and risk levels.
      - id: ccop-12.4.2
        class: ccop-provision
        title: CCoP 12.4.2
        props:
        - name: label
          value: 12.4.2
        - name: source-page
          value: '67'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.4.2_smt
          name: statement
          prose: The CIIO shall implement firewalls at the boundaries between interconnected
            systems and between internet-facing assets and the enterprise environment,
            permitting only authorised traffic through defined firewall rules.
      - id: ccop-12.4.3
        class: ccop-provision
        title: CCoP 12.4.3
        props:
        - name: label
          value: 12.4.3
        - name: source-page
          value: '67'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.4.3_smt
          name: statement
          prose: The CIIO shall monitor and block unauthorised outbound network connections
            from interconnected systems to secure network communications.
    - id: ccop-g-12.5
      class: ccop-subsection
      title: System Hardening
      props:
      - name: label
        value: '12.5'
      controls:
      - id: ccop-12.5.1
        class: ccop-provision
        title: CCoP 12.5.1
        props:
        - name: label
          value: 12.5.1
        - name: source-page
          value: '68'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.5.1_smt
          name: statement
          prose: The CIIO shall enable only ports, services or protocols that are
            necessary for the operations of the interconnected systems.
      - id: ccop-12.5.2
        class: ccop-provision
        title: CCoP 12.5.2
        props:
        - name: label
          value: 12.5.2
        - name: source-page
          value: '68'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.5.2_smt
          name: statement
          prose: The CIIO shall disable unused ports, services or protocols on internet-facing
            devices, such as routers, firewalls, and VPN gateways, that are not required
            for operations.
    - id: ccop-g-12.6
      class: ccop-subsection
      title: Patch Management
      props:
      - name: label
        value: '12.6'
      controls:
      - id: ccop-12.6.1
        class: ccop-provision
        title: CCoP 12.6.1
        props:
        - name: label
          value: 12.6.1
        - name: source-page
          value: '68'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.6.1_smt
          name: statement
          prose: The CIIO shall establish and implement security patch management
            processes and apply security patches to interconnected systems in a timely
            manner to reduce cybersecurity vulnerabilities. Apply appropriate compensating
            controls to mitigate and reduce cybersecurity risks in cases where a security
            patch cannot be applied.
    - id: ccop-g-12.7
      class: ccop-subsection
      title: Monitoring and Detection
      props:
      - name: label
        value: '12.7'
      controls:
      - id: ccop-12.7.1
        class: ccop-provision
        title: CCoP 12.7.1
        props:
        - name: label
          value: 12.7.1
        - name: source-page
          value: '68'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.7.1_smt
          name: statement
          prose: The CIIO shall establish and implement mechanisms and processes to
            review the activities (e.g. login and authentication events, configuration
            changes, remote access sessions) and traffic associated with the network
            management and monitoring servers across interconnected systems and investigate
            any anomalies detected that may indicate unauthorised access or suspicious
            behaviour. The review of the activities shall be conducted on a regular
            basis from the time the processes are implemented.
      - id: ccop-12.7.2
        class: ccop-provision
        title: CCoP 12.7.2
        props:
        - name: label
          value: 12.7.2
        - name: source-page
          value: '68'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.7.2_smt
          name: statement
          prose: The CIIO shall establish and implement mechanisms and processes,
            and conduct the review of endpoint detection logs across interconnected
            systems including the identification of anomalous activities which do
            not trigger pre-configured alerts.
      - id: ccop-12.7.3
        class: ccop-provision
        title: CCoP 12.7.3
        props:
        - name: label
          value: 12.7.3
        - name: source-page
          value: '68'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.7.3_smt
          name: statement
          prose: The CIIO shall establish and implement mechanisms and processes to
            monitor virtualised environments used in interconnected systems including
            vCenter and ESXi hosts, for anomalous activities and trigger an alert
            for investigation when an anomaly is detected.
      - id: ccop-12.7.4
        class: ccop-provision
        title: CCoP 12.7.4
        props:
        - name: label
          value: 12.7.4
        - name: source-page
          value: '68'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.7.4_smt
          name: statement
          prose: The CIIO shall ensure that the virtualisation management infrastructure
            including vCenter Servers and ESXi hosts, run supported versions and are
            fully patched. Apply appropriate compensating controls to mitigate and
            reduce cybersecurity risks in cases where updates or patches cannot be
            applied.
      - id: ccop-12.7.5
        class: ccop-provision
        title: CCoP 12.7.5
        props:
        - name: label
          value: 12.7.5
        - name: source-page
          value: '68'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.7.5_smt
          name: statement
          prose: The CIIO shall establish and implement mechanisms and processes to
            report suspicious activities observed across the interconnected systems
            in accordance with the National Cybersecurity Incident Reporting Framework
            to CSA.
      - id: ccop-12.7.6
        class: ccop-provision
        title: CCoP 12.7.6
        props:
        - name: label
          value: 12.7.6
        - name: source-page
          value: '68'
          ns: https://baden.id/ns/ccop-cii
        parts:
        - id: ccop-12.7.6_smt
          name: statement
          prose: The CIIO shall review the mechanisms and processes established under
            clauses 12.7.1, 12.7.2, 12.7.3 and 12.7.5 at least once every 12 months,
            or as often as required based on the evolving cyber threat landscape,
            to ensure that the mechanisms and processes remain effective for their
            purposes. The first instance of this review is to be completed no later
            than 12 months from the time the mechanisms and processes are implemented.
