    - uuid: 9190ca6e-1cdf-598b-a9ee-e77c39a6bd04
      title: GUIDANCE FOR STRENGTHENING ENTERPRISE CYBERSECURITY POSTURE
      description: 'An organisation’s cybersecurity is only as strong as its weakest
        link. Even as measures are taken under this code to ensure the cybersecurity
        of the CII, it is vital that CIIOs ensure cybersecurity throughout its organisation.
        This Annex A seeks to provide guidance for strengthening the cybersecurity
        posture of the organisation as a whole. CIIOs are highly encouraged to implement
        these measures. For the avoidance of doubt, the areas listed in this Annex
        are not required to be included in the cybersecurity audit scope conducted
        under section 15 of the Act. Domain Guidance Security-by-1. The CIIO should
        adopt the Security-by-Design Framework established by Design CSA to the extent
        that it applies to the system development lifecycle of a computer or computer
        system used by the organisation. Where there are parts of the Framework which
        do not apply to the system development lifecycle, the CIIO should document
        how and why these parts are not applicable. Cybersecurity 1. The CIIO should
        adopt the defence-in-depth principle to ensure that the Design Principles
        security architecture of a computer or computer system used by the organisation
        includes multiple layers of security controls to prevent single point of failure.
        2. The CIIO should adopt the least privilege principle to ensure that accounts
        and users are granted the least extent of access necessary to perform their
        required functions. 3. The CIIO should adopt the principle of segregation
        of duties to ensure that duties and responsibilities for critical functions
        relating to a computer or computer system used by the organisation are divided
        among different persons. 4. The CIIO should also adopt, to the extent possible,
        the following principles in relation to its people, process and technologies
        to reduce cybersecurity risks to a computer or computer system used by the
        organisation: (a) The defence-by-diversity principle to reduce the number
        of potential attack vectors by having diversity throughout a computer or computer
        system used by the organisation, including diversity in technology, manufacturers
        and suppliers of assets, communication pathways, etc.; and Domain Guidance
        (b) The zero-trust principle to ensure that each request for access to any
        computer or computer system used by the organisation is authenticated, authorised
        and validated for security configuration and posture before access is granted.
        Wireless 1. The CIIO should ensure that a computer or computer system used
        by the Communication organisation is not connected to any wireless Local Area
        Network (LAN) except where necessary for authorised operations. Where any
        such connection is necessary, the CIIO should ensure that: (a) Only authorised
        wireless LAN is used; (b) The connection has strong encryption; and (c) Only
        authorised devices are allowed to connect to the wireless LAN. Vulnerability
        1. The CIIO shall establish processes to identify and track cybersecurity
        Assessment vulnerabilities on IT systems used by the organisation. 2. The
        CIIO shall remediate all cybersecurity vulnerabilities in a timely manner,
        with priority given to vulnerabilities that pose a greater risk to the security
        or operations of the CII. 3. The CIIO shall conduct a vulnerability assessment
        on an IT system used by the organisation at least once every 12 months and
        on an OT system used by the organisation system at least once every 24 months.
        Penetration 1. The CIIO should conduct a penetration test on an IT system
        used by the Testing organisation at least once every 12 months and on an OT
        system used by the organisation system at least once every 24 months. 2. The
        CIIO should conduct penetration tests on relevant assets after implementing
        any major system changes to computer or computer system used by the organisation.
        Major system changes include commissioning any new systems to be connected
        to the computer or computer system used by the organisation, implementing
        new application modules, system upgrades and technology refresh. 3. The CIIO
        should ensure that third-party penetration testing service providers and their
        penetration testers who are performing penetration tests on a computer or
        computer system used by the organisation possess industry-recognised accreditations
        and certifications respectively, for example CREST or equivalent accreditations
        and certifications. Domain Guidance Threat Hunting 1. The CIIO should conduct
        threat hunting for a computer or computer system used by the organisation
        to search for and identify cybersecurity threats to the systems at least once
        every 24 months. The first instance of threat hunting should be completed
        no later than 12 months after the Compliance Date. 2. The CIIO should include
        cybersecurity threats identified from threat hunting in cybersecurity risk
        assessments to ensure that the risks derived from the threats are assessed,
        mitigated, and tracked throughout the the system development lifecycle of
        a computer or computer system used by the organisation. 3. The CIIO should
        analyse all threats identified from threat hunting to determine if there is
        or has been any cybersecurity incident in respect of a computer or computer
        system used by the organisation, and should trigger the applicable incident
        reporting, response and recovery plans if there is or has been a cybersecurity
        incident. Breach Attack 1. The CIIO should conduct Breach and Attack Simulation
        to continuously Simulation and automatically simulate real-world attack scenarios
        against the CIIO’s defences to identify gaps. Domain Name 1. The CIIO should
        ensure that all domain names under its control and used System in connection
        with any computer or computer system used by the organisation, including in
        the delivery of services, are DNSSEC-signed on the corresponding DNS Authoritative
        Server for each domain name. 2. The CIIO should enable DNSSEC validation or
        implement any equivalent or better methods of validating the integrity of
        DNS records, for DNS resolver to prevent DNS attacks such as DNS cache poisoning
        and DNS spoofing. - END -'
